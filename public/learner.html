<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Learner Portal — JOYLAND SCHOOLS</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--green:#1B5E20;--green2:#2E7D32;--green3:#43A047;--gold:#FFC107;--gold2:#F9A825;--white:#fff;--gray:#f4f6f9;--text:#2d3748;--muted:#718096;--border:#e2e8f0;--shadow:0 4px 20px rgba(0,0,0,0.08);}
body{font-family:'Poppins',sans-serif;background:var(--gray);color:var(--text);min-height:100vh;}

.topbar{background:linear-gradient(135deg,#0d2818,var(--green2));padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 20px rgba(0,0,0,0.3);}
.brand{display:flex;align-items:center;gap:12px;}
.brand-icon{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--gold2),var(--gold));display:flex;align-items:center;justify-content:center;}
.brand-icon i{color:var(--green);font-size:18px;}
.brand-name{color:var(--white);font-weight:700;font-size:15px;}
.brand-motto{color:rgba(255,255,255,0.5);font-size:10px;font-style:italic;}
.user-info{display:flex;align-items:center;gap:10px;}
.user-pill{background:rgba(255,255,255,0.1);border-radius:30px;padding:6px 14px;color:var(--white);font-size:13px;display:flex;align-items:center;gap:7px;}
.user-pill i{color:var(--gold);}
.logout-btn{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:var(--white);border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;font-family:'Poppins',sans-serif;display:flex;align-items:center;gap:6px;transition:.2s;}
.logout-btn:hover{background:rgba(255,255,255,0.2);}

.hero{background:linear-gradient(160deg,#0d2818 0%,var(--green2) 60%,#1a7a30 100%);padding:36px 24px 60px;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;width:400px;height:400px;border-radius:50%;background:rgba(255,193,7,0.06);top:-100px;right:-100px;}
.hero::after{content:'';position:absolute;width:250px;height:250px;border-radius:50%;background:rgba(255,255,255,0.03);bottom:-80px;left:60px;}
.hero-inner{position:relative;z-index:1;max-width:1100px;margin:0 auto;}
.hero-main{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
.learner-photo{width:82px;height:82px;border-radius:50%;background:rgba(255,255,255,0.12);border:3px solid rgba(255,255,255,0.25);display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:28px;font-weight:800;background-size:cover;background-position:center;flex-shrink:0;}
.learner-photo.has-photo{color:transparent;background-color:rgba(255,255,255,0.18);}
.hero-greeting{color:rgba(255,255,255,0.6);font-size:14px;}
.hero-name{color:var(--white);font-size:26px;font-weight:700;margin:4px 0;}
.hero-meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;}
.meta-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600;}
.meta-badge.gold{background:rgba(255,193,7,0.15);border:1px solid rgba(255,193,7,0.3);color:var(--gold);}
.meta-badge.white{background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.8);}

.wave{display:block;width:100%;margin-top:-2px;}

.content{max-width:1100px;margin:-30px auto 0;padding:0 24px 40px;position:relative;z-index:1;}

.session-banner{background:linear-gradient(135deg,var(--gold2),var(--gold));border-radius:16px;padding:20px 24px;margin-bottom:24px;display:flex;align-items:center;gap:16px;box-shadow:0 8px 25px rgba(255,193,7,0.3);}
.session-banner i{font-size:28px;color:var(--green);}
.session-banner .sb-title{font-size:16px;font-weight:700;color:var(--green);}
.session-banner .sb-sub{font-size:12px;color:rgba(27,94,32,0.7);}

.terms-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-bottom:28px;}
.term-card{background:var(--white);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);transition:.2s;}
.term-card:hover{transform:translateY(-4px);box-shadow:0 12px 35px rgba(0,0,0,0.12);}
.term-card-header{background:linear-gradient(135deg,var(--green2),var(--green3));padding:18px 20px;color:var(--white);}
.term-card-header h3{font-size:16px;font-weight:700;}
.term-card-header .dates{font-size:11px;opacity:.8;margin-top:4px;}
.term-card-body{padding:18px 20px;}
.school-days-big{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,rgba(27,94,32,0.06),rgba(67,160,71,0.08));border-radius:10px;padding:14px;margin-bottom:14px;}
.sdb-num{font-size:36px;font-weight:800;color:var(--green2);line-height:1;}
.sdb-lbl{font-size:12px;color:var(--muted);line-height:1.4;}
.sdb-lbl strong{display:block;color:var(--text);}
.mini-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.mini-stat{background:var(--gray);border-radius:8px;padding:10px;text-align:center;}
.mini-stat .ms-num{font-size:18px;font-weight:700;color:var(--green2);}
.mini-stat .ms-lbl{font-size:10px;color:var(--muted);}
.weekdays-row{display:flex;gap:5px;flex-wrap:wrap;}
.wd-pill{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;background:rgba(67,160,71,0.1);color:var(--green2);}

.holidays-list{margin-top:12px;}
.h-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.holiday-row{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:rgba(229,62,62,0.04);border:1px solid rgba(229,62,62,0.08);border-radius:7px;margin-bottom:5px;}
.holiday-row .hn{font-size:12px;font-weight:600;color:#c53030;}
.holiday-row .hd{font-size:11px;color:var(--muted);}

.profile-card{background:var(--white);border-radius:16px;padding:24px;box-shadow:var(--shadow);margin-bottom:20px;}
.profile-card h3{font-size:15px;font-weight:700;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
.profile-card h3 i{color:var(--green3);}
.form-group{margin-bottom:14px;}
.form-group label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px;}
.form-group input{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:9px;font-family:'Poppins',sans-serif;font-size:13px;outline:none;transition:.2s;}
.form-group input:focus{border-color:var(--green3);box-shadow:0 0 0 3px rgba(67,160,71,0.1);}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 20px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:'Poppins',sans-serif;transition:.2s;}
.btn-primary{background:linear-gradient(135deg,var(--green2),var(--green3));color:var(--white);}
.btn:hover{transform:translateY(-1px);}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media(max-width:600px){.two-col{grid-template-columns:1fr;}}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;}
.photo-card{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--gray);}
.photo-card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;}
.photo-card div{padding:9px 10px;font-size:12px;font-weight:600;color:var(--text);}

.toast{position:fixed;bottom:24px;right:24px;background:#276749;color:var(--white);padding:14px 20px;border-radius:12px;font-size:13px;z-index:9999;transform:translateY(100px);opacity:0;transition:.3s;display:flex;align-items:center;gap:10px;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.error{background:#c53030;}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-icon"><i class="fas fa-graduation-cap"></i></div>
    <div><div class="brand-name">JOYLAND SCHOOLS</div><div class="brand-motto">Education Is Treasure</div></div>
  </div>
  <div class="user-info">
    <div class="user-pill"><i class="fas fa-user-graduate"></i><span id="user-name">Learner</span></div>
    <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i>Logout</button>
    </div>
</div>

<div class="hero">
  <div class="hero-inner">
    <div class="hero-main">
      <div class="learner-photo" id="hero-photo">L</div>
      <div>
    <div class="hero-greeting">Welcome back,</div>
    <div class="hero-name" id="hero-name">Loading...</div>
    <div class="hero-meta">
      <div class="meta-badge gold"><i class="fas fa-id-card"></i><span id="hero-id">—</span></div>
      <div class="meta-badge white"><i class="fas fa-school"></i><span id="hero-class">—</span></div>
      <div class="meta-badge white"><i class="fas fa-hashtag"></i>Adm: <span id="hero-adm">—</span></div>
    </div>
  </div>
  </div>
</div>
</div>

<div class="content">
  <div id="session-banner"></div>
  <div id="no-session" style="display:none;background:var(--white);border-radius:16px;padding:40px;text-align:center;color:var(--muted);">
    <i class="fas fa-calendar-times" style="font-size:40px;margin-bottom:12px;opacity:.3;display:block;"></i>
    <p>No active academic session at the moment. Check back later.</p>
  </div>

  <div class="terms-grid" id="terms-grid"></div>

  <div class="two-col">
    <div class="profile-card">
      <h3><i class="fas fa-lock"></i>Change Password</h3>
      <div class="form-group"><label>Current Password</label><input type="password" id="cur-pwd" placeholder="Current password"/></div>
      <div class="form-group"><label>New Password</label><input type="password" id="new-pwd" placeholder="New password (min 6 chars)"/></div>
      <div class="form-group"><label>Confirm Password</label><input type="password" id="conf-pwd" placeholder="Confirm new password"/></div>
      <button class="btn btn-primary" onclick="changePassword()"><i class="fas fa-save"></i>Update Password</button>
    </div>
    <div class="profile-card">
      <h3><i class="fas fa-user-graduate"></i>My Details</h3>
      <div id="profile-info" style="font-size:13px;color:var(--muted);line-height:2.3;"></div>
    </div>
  </div>
  <div class="profile-card" id="learner-photos-card" style="display:none;">
    <h3><i class="fas fa-images"></i>My Photos</h3>
    <div class="photo-grid" id="learner-photos-grid"></div>
  </div>
</div>

<div class="toast" id="toast"><i class="fas fa-check-circle"></i><span id="toast-msg"></span></div>

<script>
async function api(m,u,b){const o={method:m,headers:{'Content-Type':'application/json'}};if(b)o.body=JSON.stringify(b);return(await fetch(u,o)).json();}
function toast(msg,type='success'){const t=document.getElementById('toast');t.className=`toast show ${type}`;document.getElementById('toast-msg').textContent=msg;setTimeout(()=>t.classList.remove('show'),3000);}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function initials(name){return String(name||'L').split(/\s+/).filter(Boolean).slice(0,2).map(p=>p[0]?.toUpperCase()).join('')||'L';}
function calcDays(s,e,wds,hols){
  const dm={Sunday:0,Monday:1,Tuesday:2,Wednesday:3,Thursday:4,Friday:5,Saturday:6};
  const sel=new Set(wds.map(d=>dm[d]));const hd=new Set();
  hols.forEach(h=>{const c=new Date(h.start_date+'T00:00:00'),he=new Date(h.end_date+'T00:00:00');while(c<=he){hd.add(c.toISOString().split('T')[0]);c.setDate(c.getDate()+1);}});
  let n=0;const c=new Date(s+'T00:00:00'),en=new Date(e+'T00:00:00');
  while(c<=en){if(sel.has(c.getDay())&&!hd.has(c.toISOString().split('T')[0]))n++;c.setDate(c.getDate()+1);}
  return n;
}

async function init(){
  const me=await api('GET','/api/auth/me');
  if(!me.authenticated) return location.href='/';
  document.getElementById('user-name').textContent=me.user.name;

  const [dash,pf,photosResp]=await Promise.all([api('GET','/api/learner/dashboard'),api('GET','/api/learner/me'),api('GET','/api/learner/photos')]);

  if(pf.success){
    const u=pf.data;
    const photo=document.getElementById('hero-photo');
    document.getElementById('hero-name').textContent=u.name;
    document.getElementById('hero-id').textContent=u.user_id;
    document.getElementById('hero-class').textContent=u.class_name||'No class';
    document.getElementById('hero-adm').textContent=u.admission_no||'N/A';
    photo.textContent=initials(u.name);
    if(u.portrait_path){photo.classList.add('has-photo');photo.style.backgroundImage=`url('${u.portrait_path}')`;}
    document.getElementById('profile-info').innerHTML=`
      <div><span>User ID: </span><strong>${esc(u.user_id)}</strong></div>
      <div><span>Full Name: </span><strong>${esc(u.name)}</strong></div>
      <div><span>Admission No: </span>${esc(u.admission_no||'Not set')}</div>
      <div><span>Class: </span>${esc(u.class_name||'Not set')}</div>
      <div><span>Sex: </span>${esc(u.sex||'Not set')}</div>
      <div><span>Date of Birth: </span>${esc(u.date_of_birth||'Not set')}</div>
      <div><span>Email: </span>${esc(u.email||'Not set')}</div>
      <div><span>Phone: </span>${esc(u.phone||'Not set')}</div>
      <div><span>Address: </span>${esc(u.address||'Not set')}</div>`;
  }

  const photos=photosResp.data||[];
  if(photos.length){
    document.getElementById('learner-photos-card').style.display='block';
    document.getElementById('learner-photos-grid').innerHTML=photos.map(p=>`
      <div class="photo-card"><img src="${esc(p.file_path)}" alt="${esc(p.title||'Learner photo')}"/><div>${esc(p.title||'Learner photo')}</div></div>
    `).join('');
  }

  if(!dash.success) return;
  const {active_session,terms}=dash.data;

  if(!active_session){document.getElementById('no-session').style.display='block';return;}
  document.getElementById('session-banner').innerHTML=`
    <div class="session-banner">
      <i class="fas fa-calendar-check"></i>
      <div><div class="sb-title">${esc(active_session.name)}</div><div class="sb-sub">Current Academic Session — ${(terms||[]).length} term(s) available</div></div>
    </div>`;

  const tg=document.getElementById('terms-grid');
  if(!terms?.length){tg.innerHTML='<div style="background:var(--white);border-radius:12px;padding:30px;text-align:center;color:var(--muted);">No terms configured yet.</div>';return;}
  tg.innerHTML=terms.map(t=>{
    const wds=typeof t.weekdays==='string'?JSON.parse(t.weekdays):(t.weekdays||[]);
    const sd=calcDays(t.start_date,t.end_date,wds,t.holidays||[]);
    const total=calcDays(t.start_date,t.end_date,wds,[]);
    return`<div class="term-card">
      <div class="term-card-header">
        <h3>${esc(t.term_name)}</h3>
        <div class="dates"><i class="fas fa-calendar" style="margin-right:5px;"></i>${t.start_date} &nbsp;→&nbsp; ${t.end_date}</div>
      </div>
      <div class="term-card-body">
        <div class="school-days-big">
          <div class="sdb-num">${sd}</div>
          <div class="sdb-lbl"><strong>School Open Days</strong>After deducting holidays</div>
        </div>
        <div class="mini-stats">
          <div class="mini-stat"><div class="ms-num">${total}</div><div class="ms-lbl">Total Weekdays</div></div>
          <div class="mini-stat"><div class="ms-num" style="color:#c53030;">${total-sd}</div><div class="ms-lbl">Holiday Days</div></div>
        </div>
        <div class="weekdays-row">
          ${wds.map(d=>`<div class="wd-pill">${d.slice(0,3)}</div>`).join('')}
        </div>
        ${(t.holidays||[]).length?`
        <div class="holidays-list">
          <div class="h-label"><i class="fas fa-calendar-times" style="margin-right:4px;color:#c53030;"></i>Holidays &amp; Breaks</div>
          ${t.holidays.map(h=>`<div class="holiday-row"><div class="hn">${esc(h.name)}</div><div class="hd">${h.start_date} → ${h.end_date}</div></div>`).join('')}
        </div>`:''}
      </div>
    </div>`;
  }).join('');
}

async function changePassword(){
  const cur=document.getElementById('cur-pwd').value;
  const nw=document.getElementById('new-pwd').value;
  const cf=document.getElementById('conf-pwd').value;
  if(!cur||!nw||!cf) return toast('All fields required','error');
  if(nw!==cf) return toast('Passwords do not match','error');
  if(nw.length<6) return toast('Minimum 6 characters','error');
  const d=await api('PUT','/api/learner/change-password',{current_password:cur,new_password:nw});
  toast(d.message,d.success?'success':'error');
  if(d.success){document.getElementById('cur-pwd').value='';document.getElementById('new-pwd').value='';document.getElementById('conf-pwd').value='';}
}

async function logout(){await api('POST','/api/auth/logout');location.href='/';}
init();
</script>
</body>
</html>
