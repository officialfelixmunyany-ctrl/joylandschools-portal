<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Joyland Schools - Admin Login</title>
  <style>
    :root{
      --green:#0f3d22;
      --gold:#c99732;
      --ink:#ffffff;
      --muted:rgba(255,255,255,.72);
      --line:rgba(255,255,255,.22);
      --field:rgba(255,255,255,.1);
      --radius:8px;
    }
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      color:var(--ink);
      background:#07110b;
      overflow-x:clip;
    }
    body::before{
      content:"";
      position:fixed;
      inset:0;
      background:url("/assets/joyland-admin-login-bg.jpg") center/cover no-repeat;
      filter:brightness(.72) saturate(.82);
      transform:scale(1.02);
    }
    body::after{
      content:"";
      position:fixed;
      inset:0;
      background:
        linear-gradient(90deg,rgba(4,15,9,.82),rgba(4,15,9,.48),rgba(4,15,9,.82)),
        linear-gradient(0deg,rgba(4,15,9,.72),rgba(4,15,9,.3));
    }
    .login-shell{
      position:relative;
      z-index:1;
      min-height:100svh;
      width:min(100% - 32px,420px);
      margin:0 auto;
      display:grid;
      place-items:center;
      padding:32px 0;
    }
    .back-link{
      position:fixed;
      top:22px;
      left:22px;
      z-index:2;
      min-height:38px;
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:0 12px;
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:rgba(9,24,15,.66);
      color:#fff;
      text-decoration:none;
      font-size:.85rem;
      font-weight:850;
      backdrop-filter:blur(12px);
    }
    .back-link:hover{background:rgba(255,255,255,.12)}
    .back-link:focus-visible{outline:3px solid rgba(201,151,50,.82);outline-offset:3px}
    .login-shell::before{
      content:"";
      position:fixed;
      top:0;
      bottom:0;
      left:50%;
      width:2px;
      background:linear-gradient(180deg,transparent,var(--gold),transparent);
      opacity:0;
      transform:translateX(-50%) scaleY(.12);
      box-shadow:0 0 30px rgba(201,151,50,.52);
      pointer-events:none;
    }
    .login-card{
      width:100%;
      padding:28px;
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:rgba(9,24,15,.72);
      box-shadow:0 24px 70px rgba(0,0,0,.38);
      backdrop-filter:blur(14px);
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom:26px;
    }
    .mark{
      width:50px;
      height:50px;
      border-radius:var(--radius);
      background:#fff;
      display:grid;
      place-items:center;
      overflow:hidden;
      flex-shrink:0;
    }
    .mark img{width:100%;height:100%;object-fit:contain;padding:5px}
    .brand strong{display:block;font-size:1.08rem;line-height:1.1}
    .brand span{display:block;margin-top:3px;color:var(--muted);font-size:.82rem;font-weight:700}
    h1{
      margin:0 0 8px;
      font-size:1.55rem;
      line-height:1.15;
      letter-spacing:0;
    }
    .intro{
      margin:0 0 24px;
      color:var(--muted);
      font-size:.94rem;
      line-height:1.5;
    }
    .field{
      display:grid;
      gap:7px;
      margin-bottom:16px;
    }
    label{
      color:rgba(255,255,255,.8);
      font-size:.76rem;
      font-weight:800;
      text-transform:uppercase;
    }
    input{
      width:100%;
      min-height:48px;
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:var(--field);
      color:#fff;
      font:inherit;
      padding:0 13px;
      outline:none;
    }
    input::placeholder{color:rgba(255,255,255,.38)}
    input:focus{
      border-color:rgba(201,151,50,.85);
      box-shadow:0 0 0 3px rgba(201,151,50,.22);
      background:rgba(255,255,255,.13);
    }
    .submit{
      width:100%;
      min-height:50px;
      border:0;
      border-radius:var(--radius);
      background:var(--gold);
      color:#161006;
      font:inherit;
      font-weight:900;
      cursor:pointer;
      margin-top:6px;
    }
    .submit:hover{background:#d6aa48}
    .submit:disabled{opacity:.7;cursor:wait}
    .error{
      display:none;
      margin:0 0 16px;
      padding:11px 12px;
      border:1px solid rgba(248,113,113,.38);
      border-radius:var(--radius);
      background:rgba(127,29,29,.22);
      color:#fecaca;
      font-size:.86rem;
      line-height:1.4;
    }
    .error.show{display:block}
    .foot{
      margin:18px 0 0;
      color:rgba(255,255,255,.58);
      font-size:.78rem;
      text-align:center;
    }
    @media(max-width:460px){
      .back-link{top:14px;left:14px}
      .login-shell{width:calc(100% - 28px);align-items:end}
      .login-card{padding:22px}
      h1{font-size:1.35rem}
    }
  </style>
</head>
<body>
  <!-- Replace /assets/joyland-admin-login-bg.jpg when the final admin background photo is provided. -->
  <a class="back-link" href="/"><span aria-hidden="true">&larr;</span> Back to portal</a>
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <div class="brand">
        <div class="mark"><img src="/uploads/joyland/school/logo.jpg" alt=""></div>
        <div><strong>Joyland Schools</strong><span>Education Is Treasure</span></div>
      </div>

      <h1 id="login-title">Admin Dashboard Login</h1>
      <p class="intro">For Joyland Schools administrators only.</p>

      <p id="error-box" class="error"></p>

      <form id="login-form" autocomplete="on">
        <div class="field">
          <label for="p-identifier">Username</label>
          <input id="p-identifier" name="identifier" type="text" placeholder="Enter admin username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="p-password">Password</label>
          <input id="p-password" name="password" type="password" placeholder="Enter admin password" autocomplete="current-password" required>
        </div>
        <button class="submit" id="btn-login" type="submit">Log in to Admin Dashboard</button>
      </form>

      <p class="foot">Official Joyland Schools admin access</p>
    </section>
  </main>

  <script>
    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('error-box');
    const button = document.getElementById('btn-login');

    function tenantSlug(){
      const first = location.pathname.split('/').filter(Boolean)[0] || '';
      return first && !['login','admin','app','school'].includes(first) ? first : '';
    }

    function showError(message){
      errorBox.textContent = message;
      errorBox.classList.add('show');
    }

    function hideError(){
      errorBox.classList.remove('show');
      errorBox.textContent = '';
    }

    function setLoading(isLoading){
      button.disabled = isLoading;
      button.textContent = isLoading ? 'Logging in...' : 'Log in to Admin Dashboard';
    }

    async function doLogin(){
      hideError();
      const identifier = document.getElementById('p-identifier').value.trim();
      const password = document.getElementById('p-password').value;
      if (!identifier || !password) {
        showError('Enter the admin username and password.');
        return;
      }
      setLoading(true);
      try {
        const response = await fetch('/api/auth/login', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({ identifier, password, school_slug:tenantSlug(), admin_only:true })
        });
        const data = await response.json();
        if (data.success) {
          window.location.href = data.redirect;
          return;
        }
        showError(data.message || 'Login failed.');
      } catch (error) {
        showError('Could not connect. Try again.');
      } finally {
        setLoading(false);
      }
    }

    form.addEventListener('submit', event => {
      event.preventDefault();
      doLogin();
    });
  </script>
</body>
</html>
