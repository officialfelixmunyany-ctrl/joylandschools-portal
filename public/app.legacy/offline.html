<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B5E20">
<title>Daraja - Connecting</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--green:#1B5E20;--green2:#2E7D32;--gold:#FFC107;--text:#17231a;--muted:#667085;--line:#dce7dd;--bg:#f4f7f4;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
html,body{min-height:100%;font-family:Arial,sans-serif;background:linear-gradient(145deg,#0f2419,var(--green) 58%,var(--green2));color:var(--text)}
body{display:flex;align-items:center;justify-content:center;padding:calc(24px + var(--safe-top)) 18px calc(24px + var(--safe-bottom))}
.panel{width:100%;max-width:390px;background:#fff;border-radius:22px;padding:28px 22px 24px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.22)}
.logo{width:86px;height:86px;margin:0 auto 16px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 0 0 7px rgba(255,193,7,.2),0 0 0 14px rgba(255,193,7,.08)}
.logo img{width:100%;height:100%;object-fit:cover}
h1{font-size:20px;line-height:1.22;color:var(--green);font-weight:800;margin-bottom:8px}
p{font-size:13px;line-height:1.55;color:var(--muted);margin:0 auto 16px;max-width:310px}
.status{display:flex;align-items:center;gap:8px;justify-content:center;background:#f0fdf4;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px;color:#24582b;margin:18px 0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 0 rgba(255,193,7,.55);animation:pulse 1.25s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(255,193,7,0)}100%{box-shadow:0 0 0 0 rgba(255,193,7,0)}}
button{width:100%;border:none;border-radius:12px;background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;font-size:14px;font-weight:800;padding:14px 16px;cursor:pointer}
button:active{transform:scale(.98)}
.hint{font-size:11px;color:#7b8794;margin-top:14px;line-height:1.45}
</style>
</head>
<body>
<main class="panel">
  <div class="logo"><img src="/uploads/school/logo.jpg" alt="School logo"></div>
  <h1>Cannot Connect To Daraja</h1>
  <p>The app could not reach the live school portal. Check your internet connection, then try again.</p>
  <div class="status"><span class="dot"></span><span id="status-text">Waiting for the live school portal...</span></div>
  <button type="button" onclick="retry()">Try Again</button>
  <div class="hint">Server: <strong id="server-name">this Daraja portal</strong></div>
</main>
<script>
const APP_URL = location.origin + '/app/';
let attempts = 0;
document.getElementById('server-name').textContent = location.host || 'this Daraja portal';

function retry(){
  document.getElementById('status-text').textContent = 'Checking connection...';
  window.location.href = APP_URL + '?retry=' + Date.now();
}

setInterval(() => {
  attempts += 1;
  document.getElementById('status-text').textContent = attempts % 2
    ? 'Checking the live school portal...'
    : 'Waiting for the live school portal...';
}, 2500);
</script>
</body>
</html>
