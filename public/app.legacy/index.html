<!DOCTYPE html>
<html lang="en" class="auto-theme">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#14532d"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="format-detection" content="telephone=no"/>
<meta name="google-client-id" content="185512344104-3734njl9i02gsrncbo4b3cv50atufq12.apps.googleusercontent.com"/>
<title>Daraja</title>
<link rel="icon" href="/uploads/school/logo.jpg"/>
<link rel="apple-touch-icon" href="/uploads/school/logo.jpg"/>
<link rel="manifest" href="/app/manifest.json"/>
<link rel="stylesheet" href="/app/daraja.css"/>
</head>
<body>

<!-- Splash / reveal -->
<div id="splash">
  <div class="splash-progress"><div class="splash-progress-bar" id="splash-progress-bar"></div></div>
  <button type="button" class="splash-skip" id="splash-skip" hidden>Skip</button>

  <div class="scene active" data-scene="1">
    <div class="splash-logo" id="splash-logo"><i data-lucide="graduation-cap" style="font-size:44px;color:var(--brand-600);"></i></div>
    <div class="splash-name" id="splash-name">Daraja</div>
    <div class="splash-line">Daraja means <em>bridge</em>.</div>
    <div class="splash-dots" id="splash-dots"><i></i><i></i><i></i></div>
  </div>

  <div class="scene" data-scene="2">
    <div class="scene-triad">
      <div class="scene-pillar"><i data-lucide="book-open"></i><span>Learn</span><small>Lessons, notes, assessments &mdash; in one place.</small></div>
      <div class="scene-pillar"><i data-lucide="line-chart"></i><span>Track</span><small>Attendance, fees and results, live.</small></div>
      <div class="scene-pillar"><i data-lucide="sprout"></i><span>Grow</span><small>Every day, one bridge crossed.</small></div>
    </div>
  </div>

  <div class="scene" data-scene="3">
    <div class="splash-tag">Education is Treasure</div>
    <div class="scene-cta">Sign in to cross.</div>
    <div class="scene-arrow"><i data-lucide="arrow-down"></i></div>
  </div>
</div>

<!-- App frame -->
<div id="app" hidden>
  <div class="screens" id="screens"></div>
  <div class="tabbar hide" id="tabbar">
    <div class="tabbar-inner" id="tabbar-inner"></div>
  </div>
</div>

<div class="toast-wrap" id="toast-wrap"></div>
<div class="shroud" id="shroud" onclick="UI.closeSheet()"></div>

<script src="/vendor/lucide/lucide.min.js"></script>
<script src="/app/daraja.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/app/sw.js', { scope: '/app/' }).catch(() => {});
  });
}
</script>
</body>
</html>
