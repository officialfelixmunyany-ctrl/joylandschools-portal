<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#1B5E20"/>
<meta name="application-name" content="Daraja"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Daraja"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="format-detection" content="telephone=no"/>
<title>Daraja</title>
<link rel="manifest" href="/app/manifest.json"/>
<link rel="icon" href="/uploads/school/logo.jpg"/>
<link rel="apple-touch-icon" href="/uploads/school/logo.jpg"/>

<!-- Framework7 v8 (mobile-first PWA framework) -->
<link rel="stylesheet" href="/vendor/framework7/framework7-bundle.min.css"/>
<!-- FontAwesome for richer iconography -->
<link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css"/>

<style>
/* ═══════════════════════════════════════════════════════════════════
   DARAJA × FRAMEWORK7 — design layer on top of F7 base
   ═══════════════════════════════════════════════════════════════════ */
:root,
:root.theme-dark,
:root.md,
:root.ios{
  --f7-theme-color:#2E7D32;
  --f7-theme-color-rgb:46,125,50;
  --f7-theme-color-shade:#1B5E20;
  --f7-theme-color-tint:#43A047;

  --f7-font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --f7-text-color:#1d273b;
  --f7-page-bg-color:#f6f8fb;
  --f7-block-strong-bg-color:#ffffff;

  --f7-navbar-bg-color:#1B5E20;
  --f7-navbar-text-color:#ffffff;
  --f7-navbar-link-color:#ffffff;

  --f7-tabbar-link-active-color:#2E7D32;
  --f7-tabbar-link-inactive-color:#98a2b3;

  --d-green:#1B5E20;
  --d-green2:#2E7D32;
  --d-green3:#43A047;
  --d-green4:#66BB6A;
  --d-gold:#FFC107;
  --d-gold2:#F9A825;
  --d-text:#1d273b;
  --d-muted:#667382;
  --d-bg:#f6f8fb;
  --d-border:#eaecef;
  --d-card-shadow:0 1px 2px rgba(15,23,42,.06),0 2px 4px rgba(15,23,42,.04);
  --d-card-shadow-hover:0 12px 24px -6px rgba(15,23,42,.12),0 4px 8px -4px rgba(15,23,42,.06);
}

*,*::before,*::after{box-sizing:border-box;}
html,body{font-family:var(--f7-font-family);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;letter-spacing:0;}
#app{position:fixed;top:0;bottom:0;left:50%;width:100%;max-width:480px;transform:translateX(-50%);overflow:hidden;background:var(--d-bg);box-shadow:0 0 0 1px rgba(15,23,42,.04),0 16px 48px rgba(15,23,42,.12);}

/* ═══ Splash (CSS-only, fades out after auth check) ═══ */
#splash{position:fixed;inset:0;z-index:99999;background:radial-gradient(circle at 50% 30%,#1f7a30 0%,var(--d-green) 35%,#0f2419 90%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:opacity .45s ease,visibility .45s ease;}
#splash.gone{opacity:0;visibility:hidden;pointer-events:none;}
.splash-orbs{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle 200px at 20% 80%,rgba(255,193,7,.08),transparent 70%),radial-gradient(circle 240px at 80% 20%,rgba(67,160,71,.12),transparent 70%);animation:orbFloat 6s ease-in-out infinite alternate;}
@keyframes orbFloat{from{transform:scale(1);opacity:.9;}to{transform:scale(1.15);opacity:1;}}
.splash-logo{position:relative;z-index:2;width:108px;height:108px;border-radius:50%;background:linear-gradient(135deg,#fff,#f0fdf4);display:flex;align-items:center;justify-content:center;margin-bottom:22px;box-shadow:0 0 0 8px rgba(255,193,7,.2),0 0 0 16px rgba(255,193,7,.08),0 16px 36px rgba(0,0,0,.3);overflow:hidden;animation:logoIn .7s cubic-bezier(.34,1.56,.64,1);}
.splash-logo img{width:100%;height:100%;object-fit:contain;padding:9px;background:#fff;}
.splash-logo i{font-size:48px;color:var(--d-green);}
@keyframes logoIn{from{transform:scale(.6) rotate(-20deg);opacity:0;}to{transform:scale(1) rotate(0);opacity:1;}}
.splash-name{position:relative;z-index:2;font-size:28px;font-weight:800;letter-spacing:.04em;background:linear-gradient(135deg,#fff,#ffd54f);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:fadeUp .55s cubic-bezier(.16,1,.3,1) .15s both;}
.splash-tag{position:relative;z-index:2;font-size:11px;font-weight:600;letter-spacing:.3em;color:rgba(255,255,255,.55);text-transform:uppercase;margin-top:8px;animation:fadeUp .55s cubic-bezier(.16,1,.3,1) .25s both;}
.splash-spinner{position:relative;z-index:2;width:36px;height:36px;border:3px solid rgba(255,255,255,.2);border-top-color:var(--d-gold);border-radius:50%;animation:spin .8s linear infinite;margin-top:26px;}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

/* ═══ Login screen ═══ */
#login-screen{position:fixed;inset:0;z-index:9998;background:radial-gradient(circle 600px at 80% 10%,rgba(67,160,71,.4),transparent 60%),radial-gradient(circle 500px at 10% 90%,rgba(255,193,7,.18),transparent 70%),linear-gradient(160deg,#0f2419 0%,var(--d-green) 50%,var(--d-green2) 100%);display:flex;align-items:center;justify-content:center;padding:24px 18px;overflow-y:auto;transition:opacity .35s ease,visibility .35s ease;}
#login-screen.gone{opacity:0;visibility:hidden;pointer-events:none;}
#login-screen::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle 120px at 15% 25%,rgba(255,255,255,.04),transparent),radial-gradient(circle 180px at 85% 75%,rgba(255,193,7,.06),transparent);animation:orbFloat 8s ease-in-out infinite alternate;}
.login-card{position:relative;z-index:1;width:min(100%,420px);background:#fff;border-radius:24px;padding:30px 22px 26px;box-shadow:0 32px 64px -12px rgba(0,0,0,.25),0 0 0 1px rgba(255,255,255,.08);animation:loginIn .55s cubic-bezier(.34,1.56,.64,1);}
@keyframes loginIn{from{opacity:0;transform:translateY(20px) scale(.96);}to{opacity:1;transform:translateY(0) scale(1);}}
.login-brand{text-align:center;margin-bottom:22px;}
.login-logo{width:82px;height:82px;border-radius:50%;background:#fff;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 7px rgba(255,193,7,.18),0 12px 24px -8px rgba(249,168,37,.4);overflow:hidden;animation:logoPulse 3s ease-in-out infinite;}
@keyframes logoPulse{0%,100%{box-shadow:0 0 0 6px rgba(255,193,7,.18),0 12px 24px -8px rgba(249,168,37,.4);}50%{box-shadow:0 0 0 10px rgba(255,193,7,.12),0 16px 32px -8px rgba(249,168,37,.5);}}
.login-logo img{width:100%;height:100%;object-fit:contain;padding:7px;background:#fff;}
.login-logo i{font-size:36px;color:var(--d-green);}
.login-school-name{font-size:18px;font-weight:800;background:linear-gradient(135deg,var(--d-green),var(--d-green2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.04em;text-transform:uppercase;line-height:1.2;}
.login-motto{font-size:11px;color:var(--d-muted);font-style:italic;margin-top:4px;letter-spacing:.5px;}
.login-title{text-align:center;margin:22px 0 4px;font-size:17px;font-weight:700;color:var(--d-text);letter-spacing:-.01em;}
.login-sub{text-align:center;font-size:12.5px;color:var(--d-muted);margin-bottom:20px;}
.login-tabs{display:flex;background:var(--d-bg);border-radius:10px;padding:4px;gap:4px;margin-bottom:18px;}
.login-tabs button{flex:1;padding:10px 6px;border:none;background:transparent;font-family:inherit;font-size:12px;font-weight:600;color:var(--d-muted);border-radius:8px;cursor:pointer;transition:.2s;letter-spacing:-.005em;}
.login-tabs button.active{background:linear-gradient(135deg,var(--d-green2),var(--d-green3));color:#fff;box-shadow:0 4px 12px rgba(46,125,50,.32);}
.login-field{margin-bottom:14px;}
.login-field label{display:block;font-size:11px;font-weight:600;color:var(--d-muted);margin-bottom:6px;letter-spacing:.05em;text-transform:uppercase;}
.login-input-wrap{position:relative;}
.login-input-wrap > i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--d-text);font-size:15px;pointer-events:none;z-index:1;}
.login-field input{width:100%;padding:13px 14px 13px 42px;background:var(--d-bg);border:1.5px solid transparent;border-radius:10px;font-family:inherit;font-size:14px;color:var(--d-text);outline:none;transition:.2s;}
.login-field input[type="password"],.login-field input[type="text"]#login-password{padding-right:48px;}
.login-field input:focus{border-color:var(--d-green3);background:#fff;box-shadow:0 0 0 4px rgba(67,160,71,.1);}
.eye-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:transparent;border:0;border-radius:10px;color:var(--d-muted);cursor:pointer;padding:0;font-size:14px;z-index:2;}
.eye-btn i{position:static;transform:none;pointer-events:none;}
.login-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--d-green2),var(--d-green3));color:#fff;border:none;border-radius:10px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:-.005em;margin-top:6px;transition:.2s;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 14px rgba(46,125,50,.32),inset 0 1px 0 rgba(255,255,255,.18);}
.login-btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(46,125,50,.4),inset 0 1px 0 rgba(255,255,255,.18);}
.login-btn:disabled{opacity:.6;cursor:not-allowed;transform:none;}
.install-btn{width:100%;padding:12px;background:#fff;color:var(--d-green2);border:1.5px solid rgba(46,125,50,.28);border-radius:10px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;letter-spacing:.3px;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px;}
.install-btn[hidden]{display:none;}
.login-help{margin-top:18px;text-align:center;font-size:11px;color:var(--d-muted);}
.login-alert{padding:10px 14px;border-radius:9px;font-size:12px;margin-bottom:14px;display:none;align-items:flex-start;gap:8px;line-height:1.4;}
.login-alert.error{background:rgba(214,57,57,.08);color:#9b2c2c;border:1px solid rgba(214,57,57,.2);}
.login-alert.show{display:flex;}
@media (max-width:380px){
  #login-screen{padding:18px 12px;}
  .login-card{border-radius:22px;padding:24px 18px 22px;}
  .login-school-name{font-size:16px;}
  .login-title{margin-top:18px;}
}
@media (max-height:720px){
  #login-screen{align-items:flex-start;}
  .login-card{margin:12px 0;}
  .login-brand{margin-bottom:16px;}
  .login-logo{width:68px;height:68px;}
}

/* ═══ F7 Navbar customization ═══ */
.navbar{background:linear-gradient(135deg,#0f2419 0%,var(--d-green) 45%,var(--d-green2) 100%);}
.md .navbar-bg,.ios .navbar-bg{background:linear-gradient(135deg,#0f2419 0%,var(--d-green) 45%,var(--d-green2) 100%);}
.navbar-bg::after,.navbar-bg::before{background:transparent;}
.navbar .title{font-weight:700;letter-spacing:-.01em;color:#fff;}
.navbar .subtitle{color:rgba(255,255,255,.78);font-size:11px;font-weight:500;}
.navbar .title + .subtitle{margin-left:5px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.navbar .link{color:#fff;}

/* ═══ F7 Tabbar customization ═══ */
.app-tabbar{position:fixed;bottom:0;left:50%;right:auto;transform:translateX(-50%);width:100%;max-width:480px;height:72px;background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);box-shadow:0 -2px 16px rgba(15,23,42,.06);border-top:1px solid var(--d-border);}
.app-tabbar::after,.app-tabbar::before,.app-tabbar .tab-link-highlight{display:none!important;}
.app-tabbar .toolbar-inner{height:72px;padding:6px 0 calc(8px + var(--f7-safe-area-bottom));display:grid;grid-template-columns:repeat(5,1fr);align-items:stretch;}
.app-tabbar .tab-link{position:relative;min-width:0;height:100%;display:flex!important;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#98a2b3!important;text-decoration:none;overflow:visible;z-index:1;transition:color .2s cubic-bezier(.4,0,.2,1);}
.app-tabbar .tab-link::before{content:'';position:absolute;top:0;left:25%;right:25%;height:3px;border-radius:0;background:linear-gradient(90deg,transparent 5%,var(--d-green3) 35%,var(--d-green2) 65%,transparent 95%);box-shadow:0 1px 6px rgba(67,160,71,.45);transform:scaleX(0);opacity:0;transition:opacity .2s cubic-bezier(.4,0,.2,1),transform .25s cubic-bezier(.34,1.56,.64,1);z-index:0;}
.app-tabbar .tab-link.tab-link-active{color:var(--d-green2)!important;}
.app-tabbar .tab-link.tab-link-active::before{opacity:1;transform:scaleX(1);}
.app-tabbar .tab-icon{display:block!important;width:auto!important;height:auto!important;line-height:1!important;font-size:21px!important;color:currentColor!important;background:none!important;text-align:center;position:relative;z-index:2;transition:transform .22s cubic-bezier(.34,1.56,.64,1);}
.app-tabbar .tab-link.tab-link-active .tab-icon{transform:scale(1.12);}
.app-tabbar .tabbar-label{display:block!important;max-width:100%;font-size:10.5px;font-weight:700;letter-spacing:0;line-height:1.1;color:currentColor!important;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;z-index:2;}
.view.tab .page-content{padding-bottom:calc(88px + var(--f7-safe-area-bottom));}

/* ═══ Hero dashboard greeting ═══ */
.hero{background:linear-gradient(135deg,var(--d-green2) 0%,var(--d-green) 70%,#0f2419 130%);color:#fff;padding:24px 18px 38px;border-radius:0 0 28px 28px;margin:-15px -15px 0;position:relative;overflow:hidden;box-shadow:0 8px 24px -10px rgba(27,94,32,.45);}
.hero::after{content:'';position:absolute;width:240px;height:240px;background:radial-gradient(circle,rgba(255,193,7,.12),transparent 70%);bottom:-100px;right:-60px;animation:orbFloat 8s ease-in-out infinite;}
.hero-greeting{font-size:13px;color:rgba(255,255,255,.78);font-weight:500;letter-spacing:.01em;}
.hero-name{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:3px;}
.hero-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;position:relative;z-index:1;}
.d-chip{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;font-size:10.5px;padding:6px 12px;border-radius:99px;font-weight:600;letter-spacing:.02em;display:inline-flex;align-items:center;gap:6px;}
.d-chip i{font-size:9px;}
.d-chip.gold{background:rgba(255,193,7,.18);border-color:rgba(255,193,7,.4);color:var(--d-gold);}

/* ═══ Stat strip ═══ */
.stat-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:-22px 18px 0;position:relative;z-index:2;}
.stat-strip .stat{background:#fff;border:1px solid var(--d-border);border-radius:12px;box-shadow:var(--d-card-shadow);padding:14px 10px;text-align:center;animation:popIn .45s cubic-bezier(.34,1.56,.64,1) both;}
.stat-strip .stat:nth-child(1){animation-delay:.15s;}
.stat-strip .stat:nth-child(2){animation-delay:.21s;}
.stat-strip .stat:nth-child(3){animation-delay:.27s;}
.stat .v{font-size:22px;font-weight:800;color:var(--d-text);letter-spacing:-.03em;line-height:1;}
.stat .l{font-size:10px;color:var(--d-muted);font-weight:600;letter-spacing:.05em;margin-top:5px;text-transform:uppercase;}
@keyframes popIn{0%{opacity:0;transform:scale(.94);}60%{transform:scale(1.02);}100%{opacity:1;transform:scale(1);}}

/* ═══ Section / content ═══ */
.d-content{padding:0 18px 24px;}
.d-section{margin-top:24px;animation:fadeUp .4s cubic-bezier(.16,1,.3,1) both;}
.d-section:nth-of-type(1){animation-delay:.05s;}
.d-section:nth-of-type(2){animation-delay:.12s;}
.d-section:nth-of-type(3){animation-delay:.19s;}
.d-section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.d-section-title{font-size:11.5px;font-weight:700;color:#324054;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px;}
.d-section-title i{color:var(--d-green3);font-size:13px;}
.d-section-link{color:var(--d-green2);font-size:11.5px;font-weight:600;text-decoration:none;}

/* ═══ Quick-action tiles (Tabler-style refined) ═══ */
.actions-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.action-tile{background:#fff;border:1px solid var(--d-border);border-radius:14px;padding:18px 12px 16px;box-shadow:var(--d-card-shadow);text-align:center;cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden;animation:fadeUp .4s cubic-bezier(.16,1,.3,1) both;}
.action-tile:nth-child(1){animation-delay:.04s;}
.action-tile:nth-child(2){animation-delay:.09s;}
.action-tile:nth-child(3){animation-delay:.14s;}
.action-tile:nth-child(4){animation-delay:.19s;}
.action-tile:nth-child(5){animation-delay:.24s;}
.action-tile:nth-child(6){animation-delay:.29s;}
.action-tile:hover{transform:translateY(-4px);box-shadow:var(--d-card-shadow-hover);border-color:var(--d-green4);}
.action-tile:active{transform:translateY(-1px) scale(.98);}
.action-tile .icon-wrap{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-size:21px;color:#fff;box-shadow:0 4px 12px -2px rgba(0,0,0,.18);transition:transform .3s cubic-bezier(.34,1.56,.64,1);}
.action-tile:hover .icon-wrap{transform:scale(1.08) rotate(-4deg);}
.action-tile .label{font-size:12.5px;font-weight:700;color:var(--d-text);letter-spacing:-.005em;line-height:1.3;}
.action-tile .sub{font-size:10px;color:var(--d-muted);font-weight:500;margin-top:3px;}
.action-tile .badge-dot{position:absolute;top:10px;right:12px;background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;}
.tile-green   .icon-wrap{background:linear-gradient(135deg,var(--d-green2),var(--d-green3));}
.tile-gold    .icon-wrap{background:linear-gradient(135deg,var(--d-gold2),var(--d-gold));}
.tile-blue    .icon-wrap{background:linear-gradient(135deg,#2b6cb0,#3182ce);}
.tile-purple  .icon-wrap{background:linear-gradient(135deg,#6b46c1,#805ad5);}
.tile-orange  .icon-wrap{background:linear-gradient(135deg,#dd6b20,#ed8936);}
.tile-teal    .icon-wrap{background:linear-gradient(135deg,#0987a0,#0bc5ea);}
.tile-rose    .icon-wrap{background:linear-gradient(135deg,#be185d,#ec4899);}

/* ═══ Class cards ═══ */
.class-list{display:flex;flex-direction:column;gap:10px;}
.class-card-btn{width:100%;background:#fff;border:1px solid var(--d-border);border-radius:12px;padding:14px 16px;box-shadow:var(--d-card-shadow);display:flex;align-items:center;gap:12px;text-align:left;font-family:inherit;cursor:pointer;color:var(--d-text);transition:all .2s cubic-bezier(.4,0,.2,1);position:relative;animation:fadeUp .35s cubic-bezier(.16,1,.3,1) both;}
.class-card-btn:nth-child(1){animation-delay:.05s;}
.class-card-btn:nth-child(2){animation-delay:.10s;}
.class-card-btn:nth-child(3){animation-delay:.15s;}
.class-card-btn:nth-child(4){animation-delay:.20s;}
.class-card-btn:nth-child(5){animation-delay:.25s;}
.class-card-btn::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:3px;background:linear-gradient(180deg,var(--d-green3),var(--d-green2));border-radius:0 4px 4px 0;}
.class-card-btn:hover{transform:translateX(3px);box-shadow:var(--d-card-shadow-hover);border-color:var(--d-green4);}
.class-card-btn:active{transform:translateX(1px) scale(.99);}
.class-card-btn .ck{flex:1;min-width:0;}
.class-card-btn .cn{font-size:14px;font-weight:700;color:var(--d-text);letter-spacing:-.01em;}
.class-card-btn .cm{font-size:11px;color:var(--d-muted);font-weight:500;margin-top:2px;display:flex;align-items:center;gap:5px;}
.class-card-btn .cm i{font-size:10px;}
.class-card-btn .chev{color:var(--d-muted);font-size:12px;}
.att-status{font-size:9.5px;font-weight:700;padding:5px 10px;border-radius:99px;text-transform:uppercase;letter-spacing:.3px;flex-shrink:0;}
.att-marked{background:rgba(47,179,68,.12);color:#1f7a30;border:1px solid rgba(47,179,68,.2);}
.att-pending{background:rgba(247,103,7,.12);color:#a04404;border:1px solid rgba(247,103,7,.2);}
.work-toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;}
.work-toolbar input,.work-toolbar select{height:42px;border:1px solid var(--d-border);background:#fff;border-radius:12px;padding:0 12px;font-family:inherit;font-size:13px;color:var(--d-text);box-shadow:var(--d-card-shadow);}
.work-toolbar input{flex:1;min-width:0;}

.history-btn{width:100%;background:#fff;border:1px solid var(--d-border);border-radius:14px;padding:15px;display:flex;align-items:center;gap:12px;cursor:pointer;box-shadow:var(--d-card-shadow);font-family:inherit;margin-top:6px;transition:all .2s cubic-bezier(.4,0,.2,1);}
.history-btn:active{transform:scale(.99);}
.history-btn .hb-icon{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#2b6cb0,#4299e1);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;}
.history-btn .hb-text{flex:1;text-align:left;}
.history-btn .hb-title{font-size:13.5px;font-weight:900;color:var(--d-text);}
.history-btn .hb-sub{font-size:11px;color:var(--d-muted);margin-top:1px;}
.history-btn .hb-chev{color:#98a2b3;font-size:13px;}
.att-date-nav{display:grid;grid-template-columns:34px minmax(0,1fr) 34px 34px;align-items:center;gap:6px;background:#fff;border:1px solid var(--d-border);border-radius:13px;padding:6px;box-shadow:var(--d-card-shadow);}
.att-dn-arrow{width:34px;height:34px;border:none;background:var(--d-bg);border-radius:9px;color:#324054;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.att-dn-arrow:disabled{opacity:.35;}
.att-dn-center{flex:1;text-align:center;position:relative;min-width:0;}
.att-dn-day{font-size:12.5px;font-weight:900;color:var(--d-text);letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.att-dn-full{font-size:9.5px;color:var(--d-muted);font-weight:700;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.att-date-input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;}
.att-dn-today{width:34px;height:34px;background:rgba(46,125,50,.1);border:1px solid rgba(46,125,50,.2);color:var(--d-green2);font-size:12px;font-weight:900;padding:0;border-radius:9px;cursor:pointer;flex-shrink:0;letter-spacing:0;font-family:inherit;display:flex;align-items:center;justify-content:center;}
.att-tally-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;}
.att-tally-card{border-radius:12px;padding:11px 8px;text-align:center;border:1px solid;}
.att-tally-card .tc-v{font-size:21px;font-weight:900;letter-spacing:-.03em;line-height:1;}
.att-tally-card .tc-l{font-size:9.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin-top:4px;}
.att-tally-card.tcp{background:rgba(47,179,68,.08);border-color:rgba(47,179,68,.22);}
.att-tally-card.tcp .tc-v,.att-tally-card.tcp .tc-l{color:#1f7a30;}
.att-tally-card.tca{background:rgba(214,57,57,.07);border-color:rgba(214,57,57,.2);}
.att-tally-card.tca .tc-v,.att-tally-card.tca .tc-l{color:#9b2c2c;}
.att-tally-card.tcl{background:rgba(247,103,7,.08);border-color:rgba(247,103,7,.22);}
.att-tally-card.tcl .tc-v,.att-tally-card.tcl .tc-l{color:#a04404;}
.att-bulk-row{display:flex;gap:8px;margin-top:12px;}
.att-bulk-chip{flex:1;border:1px solid var(--d-border);background:#fff;border-radius:11px;padding:10px 8px;font-family:inherit;font-size:11.5px;font-weight:900;color:#324054;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:var(--d-card-shadow);}
.att-bulk-chip.green{color:#1f7a30;border-color:rgba(47,179,68,.3);background:rgba(47,179,68,.05);}
.att-search-box{position:relative;margin-top:10px;}
.att-search-box i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#98a2b3;font-size:13px;}
.att-search-box input{width:100%;border:1px solid var(--d-border);background:#fff;border-radius:11px;padding:11px 12px 11px 36px;font-family:inherit;font-size:13px;color:var(--d-text);box-shadow:var(--d-card-shadow);outline:none;}
.att-learner-list{margin-top:12px;}
.att-learner-row{background:#fff;border:1px solid var(--d-border);border-left-width:3px;border-radius:13px;padding:11px 12px;margin-bottom:8px;box-shadow:var(--d-card-shadow);transition:border-color .2s cubic-bezier(.4,0,.2,1),background .2s cubic-bezier(.4,0,.2,1);}
.att-learner-row.hidden{display:none;}
.att-learner-row.status-p{border-left-color:#2fb344;}
.att-learner-row.status-a{border-left-color:#d63939;background:rgba(214,57,57,.018);}
.att-learner-row.status-l{border-left-color:#f76707;background:rgba(247,103,7,.022);}
.att-lr-main{display:flex;align-items:center;gap:11px;}
.att-lr-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--d-green3),var(--d-green2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:900;letter-spacing:-.02em;flex-shrink:0;}
.att-lr-info{flex:1;min-width:0;}
.att-lr-name{font-size:13.5px;font-weight:900;color:var(--d-text);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.att-lr-adm{font-size:10.5px;color:var(--d-muted);font-weight:600;margin-top:1px;}
.att-pal-toggle{display:flex;background:var(--d-bg);border:1px solid var(--d-border);border-radius:10px;padding:3px;gap:2px;flex-shrink:0;}
.att-pal-btn{width:34px;height:32px;border:none;background:transparent;border-radius:7px;font-family:inherit;font-size:13px;font-weight:900;color:var(--d-muted);cursor:pointer;transition:all .15s cubic-bezier(.4,0,.2,1);}
.att-pal-btn.active.pp{background:#2fb344;color:#fff;box-shadow:0 2px 6px rgba(47,179,68,.4);}
.att-pal-btn.active.pa{background:#d63939;color:#fff;box-shadow:0 2px 6px rgba(214,57,57,.4);}
.att-pal-btn.active.pl{background:#f76707;color:#fff;box-shadow:0 2px 6px rgba(247,103,7,.4);}
.att-lr-late{display:none;gap:7px;margin-top:9px;padding-top:9px;border-top:1px dashed var(--d-border);}
.att-learner-row.status-l .att-lr-late{display:flex;}
.att-lr-late input{border:1px solid var(--d-border);background:var(--d-bg);border-radius:9px;padding:8px 10px;font-family:inherit;font-size:12px;color:var(--d-text);outline:none;}
.att-lr-late input[type=time]{width:96px;flex-shrink:0;}
.att-lr-late input[type=text]{flex:1;min-width:0;}
.att-save-bar{position:sticky;bottom:calc(var(--f7-safe-area-bottom) + 74px);z-index:8;background:rgba(255,255,255,.96);backdrop-filter:saturate(180%) blur(16px);border:1px solid var(--d-border);border-radius:16px;padding:9px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(15,23,42,.08);margin-top:14px;}
.att-save-info{flex:1;min-width:0;}
.att-save-count{font-size:12px;font-weight:900;color:var(--d-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.att-save-unsaved{font-size:10px;color:#f76707;font-weight:900;display:flex;align-items:center;gap:5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.att-save-unsaved::before{content:'';width:6px;height:6px;border-radius:50%;background:#f76707;}
.att-save-unsaved.clean{color:var(--d-muted);}
.att-save-unsaved.clean::before{background:#2fb344;}
.att-save-btn{border:none;background:linear-gradient(135deg,var(--d-green2),var(--d-green3));color:#fff;font-family:inherit;font-size:12.5px;font-weight:900;padding:11px 14px;border-radius:12px;cursor:pointer;box-shadow:0 6px 16px rgba(46,125,50,.32);letter-spacing:0;flex-shrink:0;min-width:74px;}
.att-save-btn:disabled{opacity:.62;}
.att-note{font-size:11px;color:#98a2b3;text-align:center;padding:14px 20px;line-height:1.5;}
.att-summary-card{background:#fff;border:1px solid var(--d-border);border-radius:14px;padding:16px;box-shadow:var(--d-card-shadow);margin-top:12px;display:flex;align-items:center;gap:16px;}
.att-sm-ring{width:74px;height:74px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--d-green3) 0% var(--pct,0%),var(--d-border) var(--pct,0%) 100%);}
.att-sm-ring-inner{width:58px;height:58px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.att-sm-ring-inner .v{font-size:18px;font-weight:900;color:var(--d-green2);letter-spacing:-.03em;line-height:1;}
.att-sm-ring-inner .l{font-size:8px;font-weight:800;color:var(--d-muted);text-transform:uppercase;letter-spacing:.04em;margin-top:1px;}
.att-sm-text{flex:1;}
.att-sm-title{font-size:13.5px;font-weight:900;color:var(--d-text);}
.att-sm-detail{font-size:11.5px;color:var(--d-muted);font-weight:600;margin-top:3px;line-height:1.5;}
.att-sm-detail b{color:#324054;font-weight:900;}
.att-day-row{background:#fff;border:1px solid var(--d-border);border-radius:12px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--d-card-shadow);display:flex;align-items:center;gap:12px;}
.att-dr-date{flex-shrink:0;text-align:center;width:42px;}
.att-dr-dom{font-size:17px;font-weight:900;color:var(--d-text);letter-spacing:-.03em;line-height:1;}
.att-dr-mon{font-size:9px;font-weight:800;color:var(--d-muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
.att-dr-bars{flex:1;min-width:0;}
.att-dr-dow{font-size:11.5px;font-weight:900;color:#324054;margin-bottom:5px;}
.att-dr-track{height:7px;border-radius:99px;display:flex;overflow:hidden;background:var(--d-bg);}
.att-dr-track .seg-p{background:#2fb344;}
.att-dr-track .seg-a{background:#d63939;}
.att-dr-track .seg-l{background:#f76707;}
.att-dr-counts{font-size:10px;color:var(--d-muted);font-weight:700;margin-top:5px;}
.att-dr-pct{flex-shrink:0;font-size:15px;font-weight:900;letter-spacing:-.02em;}
.att-dr-pct.good{color:#1f7a30;}
.att-dr-pct.mid{color:#a04404;}
.att-dr-pct.low{color:#9b2c2c;}
.att-absentee-row{background:#fff;border:1px solid var(--d-border);border-radius:12px;padding:11px 13px;margin-bottom:8px;box-shadow:var(--d-card-shadow);display:flex;align-items:center;gap:11px;}
.att-ar-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#dd6b20,#f76707);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:900;flex-shrink:0;}
.att-ar-info{flex:1;min-width:0;}
.att-ar-name{font-size:13px;font-weight:900;color:var(--d-text);letter-spacing:-.01em;}
.att-ar-meta{font-size:10.5px;color:var(--d-muted);font-weight:600;margin-top:2px;}
.att-ar-pct{text-align:right;flex-shrink:0;}
.att-ar-pct-v{font-size:15px;font-weight:900;color:#a04404;letter-spacing:-.02em;}
.att-ar-pct-l{font-size:9px;color:var(--d-muted);font-weight:800;text-transform:uppercase;letter-spacing:.04em;}

.empty-card{background:#fff;border:1px dashed #dadce1;border-radius:14px;padding:36px 22px;text-align:center;color:var(--d-muted);}
.empty-card i{font-size:36px;color:#98a2b3;margin-bottom:10px;}
.empty-card p{font-size:13px;line-height:1.5;}

/* ═══ Subject analytics card ═══ */
.subj-card{background:#fff;border:1px solid var(--d-border);border-radius:14px;padding:14px 16px;box-shadow:var(--d-card-shadow);margin-bottom:10px;animation:fadeUp .35s cubic-bezier(.16,1,.3,1) both;}
.subj-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.subj-icon{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,var(--d-green3),var(--d-green2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.subj-name{flex:1;font-size:13px;font-weight:700;color:var(--d-text);}
.subj-class{font-size:10.5px;color:var(--d-muted);}
.subj-meta-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.subj-meta{background:var(--d-bg);border-radius:8px;padding:8px 6px;text-align:center;}
.subj-meta .mv{font-size:13px;font-weight:800;color:var(--d-text);letter-spacing:-.01em;}
.subj-meta .ml{font-size:9px;font-weight:600;color:var(--d-muted);text-transform:uppercase;letter-spacing:.04em;margin-top:1px;}

/* ═══ List labels / micro headers ═══ */
.d-list-label{font-size:11px;font-weight:600;color:var(--d-muted);text-transform:uppercase;letter-spacing:.05em;padding:0 4px 6px;}

/* ═══ Skeleton loader ═══ */
@keyframes shimmer{0%{background-position:-200% 0;}100%{background-position:200% 0;}}
.skel{background:linear-gradient(90deg,#edf0f3 0%,#f6f8fb 50%,#edf0f3 100%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:8px;}
.skel-line{height:12px;margin-bottom:8px;}
.skel-card{height:88px;border-radius:14px;margin-bottom:10px;}

/* ═══ Misc helpers ═══ */
.d-flex-spread{display:flex;align-items:center;justify-content:space-between;}
.d-mt-2{margin-top:8px;}
.d-mt-3{margin-top:14px;}
.d-mb-2{margin-bottom:8px;}
.d-mb-3{margin-bottom:14px;}
.muted{color:var(--d-muted);}
.bold{font-weight:700;}
.t-toast-text{font-weight:500;}

/* Reduced motion respect */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}
}

/* iOS Safari fix: ensure full height */
html.ios body, html.md body { -webkit-overflow-scrolling:touch; }

/* Avatar for "More" tab profile head */
.d-profile-head{background:linear-gradient(135deg,var(--d-green2),var(--d-green));color:#fff;padding:24px 18px;display:flex;align-items:center;gap:14px;margin:0 0 16px;border-radius:0 0 24px 24px;box-shadow:0 8px 20px -10px rgba(15,23,42,.18);}
.d-avatar{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;letter-spacing:-.02em;flex-shrink:0;border:2px solid rgba(255,255,255,.3);}
.d-profile-name{font-size:17px;font-weight:700;letter-spacing:-.01em;}
.d-profile-role{font-size:11.5px;color:rgba(255,255,255,.78);font-weight:500;letter-spacing:.03em;text-transform:uppercase;margin-top:3px;}

/* Custom F7 list overrides */
.list .item-inner{padding-top:14px;padding-bottom:14px;}
.list .item-title{font-weight:600;letter-spacing:-.005em;}
.list .item-link .item-content{transition:background .15s ease;}
.list .item-media i{font-size:22px;}

/* "Coming soon" page */
.coming-soon{padding:60px 24px;text-align:center;}
.coming-soon .icon-circle{width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,rgba(67,160,71,.12),rgba(46,125,50,.18));display:flex;align-items:center;justify-content:center;margin:0 auto 22px;color:var(--d-green2);font-size:42px;animation:popIn .5s cubic-bezier(.34,1.56,.64,1);}
.coming-soon h3{font-size:18px;font-weight:700;color:var(--d-text);letter-spacing:-.01em;margin-bottom:8px;}
.coming-soon p{font-size:13.5px;color:var(--d-muted);line-height:1.55;max-width:300px;margin:0 auto;}

/* ═══════════════════════════════════════════════════════════════════
   HOME DASHBOARD v2 — segmented (Today / Performance / Learners)
   ═══════════════════════════════════════════════════════════════════ */
/* Hero metric cards (4 across, overlap hero) */
.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:-26px 18px 0;position:relative;z-index:2;}
.metric-card{background:#fff;border:1px solid var(--d-border);border-radius:12px;padding:12px 5px 11px;text-align:center;box-shadow:var(--d-card-shadow);position:relative;overflow:hidden;animation:popIn .45s cubic-bezier(.34,1.56,.64,1) both;}
.metric-card:nth-child(1){animation-delay:.08s;}
.metric-card:nth-child(2){animation-delay:.14s;}
.metric-card:nth-child(3){animation-delay:.20s;}
.metric-card:nth-child(4){animation-delay:.26s;}
.metric-card .mc-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin:0 auto 5px;font-size:12px;color:#fff;}
.metric-card .mc-v{font-size:17px;font-weight:800;color:var(--d-text);letter-spacing:-.03em;line-height:1;}
.metric-card .mc-v small{font-size:10px;}
.metric-card .mc-l{font-size:8.5px;color:var(--d-muted);font-weight:700;letter-spacing:.03em;margin-top:3px;text-transform:uppercase;}
.metric-card .mc-delta{position:absolute;top:5px;right:5px;font-size:8.5px;font-weight:800;padding:1px 4px;border-radius:99px;display:flex;align-items:center;gap:1px;}
.mc-delta.up{background:rgba(47,179,68,.13);color:#1f7a30;}
.mc-delta.down{background:rgba(214,57,57,.1);color:#9b2c2c;}
.mc-delta i{font-size:6px;}
.mc-green .mc-icon{background:linear-gradient(135deg,var(--d-green2),var(--d-green3));}
.mc-blue  .mc-icon{background:linear-gradient(135deg,#2b6cb0,#3182ce);}
.mc-gold  .mc-icon{background:linear-gradient(135deg,var(--d-gold2),var(--d-gold));}
.mc-orange .mc-icon{background:linear-gradient(135deg,#dd6b20,#ed8936);}

/* Sticky controls: segment control + filter bar */
.home-sticky{position:sticky;top:0;z-index:30;background:var(--d-bg);padding:16px 18px 8px;}
.seg-control{display:flex;background:#fff;border:1px solid var(--d-border);border-radius:12px;padding:4px;gap:4px;box-shadow:var(--d-card-shadow);}
.seg-btn{flex:1;border:none;background:transparent;padding:9px 4px;border-radius:9px;font-family:inherit;font-size:11.5px;font-weight:700;color:var(--d-muted);cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1);letter-spacing:-.01em;display:flex;align-items:center;justify-content:center;gap:5px;}
.seg-btn i{font-size:10px;}
.seg-btn.active{background:linear-gradient(135deg,var(--d-green2),var(--d-green3));color:#fff;box-shadow:0 4px 12px rgba(46,125,50,.3);}
.filter-bar{margin-top:8px;background:#fff;border:1px solid var(--d-border);border-radius:12px;padding:8px;display:flex;gap:6px;box-shadow:var(--d-card-shadow);}
.filter-bar.hidden{display:none;}
.filter-dd{flex:1;position:relative;min-width:0;}
.filter-dd select{width:100%;appearance:none;-webkit-appearance:none;background:var(--d-bg);border:1px solid var(--d-border);border-radius:9px;padding:8px 22px 8px 9px;font-family:inherit;font-size:11px;font-weight:700;color:var(--d-text);cursor:pointer;letter-spacing:-.01em;text-overflow:ellipsis;}
.filter-dd select:focus{outline:none;border-color:var(--d-green3);}
.filter-dd::after{content:'\f078';font-family:'Font Awesome 6 Free';font-weight:900;position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:7px;color:var(--d-muted);pointer-events:none;}

/* Segment panels */
.seg-panel{display:none;padding:4px 18px 8px;}
.seg-panel.active{display:block;}
.seg-panel.active .hsec{animation:fadeUp .35s cubic-bezier(.16,1,.3,1) both;}
.seg-panel.active .hsec:nth-of-type(1){animation-delay:.02s;}
.seg-panel.active .hsec:nth-of-type(2){animation-delay:.09s;}
.seg-panel.active .hsec:nth-of-type(3){animation-delay:.16s;}

/* Home section */
.hsec{margin-top:16px;}
.hsec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;padding:0 4px;}
.hsec-title{font-size:11px;font-weight:700;color:#324054;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:7px;}
.hsec-title i{color:var(--d-green3);font-size:12px;}
.hsec-link{font-size:10.5px;font-weight:700;color:var(--d-green2);text-decoration:none;}
.hcard{background:#fff;border:1px solid var(--d-border);border-radius:14px;box-shadow:var(--d-card-shadow);overflow:hidden;}
.card-foot{padding:11px 14px;text-align:center;background:#fafbfc;border-top:1px solid var(--d-border);font-size:11px;font-weight:700;color:var(--d-green2);cursor:pointer;letter-spacing:-.005em;}
.card-foot:active{background:#f0f3f6;}

/* Quick Insights */
.insight-item{display:flex;align-items:flex-start;gap:11px;padding:12px 14px;border-bottom:1px solid var(--d-border);}
.insight-item:last-child{border-bottom:none;}
.insight-ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;flex-shrink:0;}
.insight-ic.warn{background:linear-gradient(135deg,#dd6b20,#f76707);}
.insight-ic.good{background:linear-gradient(135deg,var(--d-green2),var(--d-green3));}
.insight-ic.info{background:linear-gradient(135deg,#2b6cb0,#4299e1);}
.insight-ic.up{background:linear-gradient(135deg,#6b46c1,#805ad5);}
.insight-tx{flex:1;font-size:12px;color:#324054;line-height:1.45;padding-top:3px;}
.insight-tx b{color:var(--d-text);font-weight:800;}

/* Marking Progress */
.comp-card{padding:15px 15px 13px;}
.comp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;}
.comp-title{font-size:12.5px;font-weight:700;color:var(--d-text);letter-spacing:-.01em;}
.comp-frac{font-size:17px;font-weight:800;color:var(--d-green2);letter-spacing:-.02em;}
.comp-frac small{font-size:11px;color:#98a2b3;font-weight:700;}
.comp-track{height:9px;background:var(--d-bg);border-radius:99px;overflow:hidden;border:1px solid var(--d-border);}
.comp-fill{height:100%;background:linear-gradient(90deg,var(--d-green3),var(--d-green2));border-radius:99px;box-shadow:0 1px 4px rgba(46,125,50,.3);transition:width .5s cubic-bezier(.16,1,.3,1);}
.comp-pct{font-size:10px;color:var(--d-muted);font-weight:700;margin-top:6px;}
.comp-subjects{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px;}
.comp-chip{font-size:10px;font-weight:700;padding:5px 9px;border-radius:99px;display:inline-flex;align-items:center;gap:5px;letter-spacing:-.005em;}
.comp-chip.done{background:rgba(47,179,68,.12);color:#1f7a30;}
.comp-chip.todo{background:var(--d-bg);color:var(--d-muted);border:1px dashed #dadce1;}
.comp-chip i{font-size:8px;}

/* Pending Tasks */
.pending-item{display:flex;align-items:center;gap:11px;padding:13px 14px;border-bottom:1px solid var(--d-border);cursor:pointer;}
.pending-item:last-child{border-bottom:none;}
.pending-item:active{background:rgba(247,103,7,.04);}
.pending-ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;flex-shrink:0;}
.pending-ic.warn{background:linear-gradient(135deg,#dd6b20,#f76707);}
.pending-ic.danger{background:linear-gradient(135deg,#dc2626,#d63939);}
.pending-ic.info{background:linear-gradient(135deg,#2b6cb0,#4299e1);}
.pending-tx{flex:1;min-width:0;}
.pending-t{font-size:12.5px;font-weight:700;color:var(--d-text);letter-spacing:-.01em;}
.pending-s{font-size:10.5px;color:var(--d-muted);margin-top:2px;}
.pending-ch{color:#98a2b3;font-size:11px;}

/* Distribution table */
.dist-table{width:100%;border-collapse:collapse;font-size:12px;}
.dist-table th{background:#fafbfc;font-weight:700;font-size:9.5px;color:var(--d-muted);text-transform:uppercase;letter-spacing:.05em;padding:10px 4px;text-align:center;border-bottom:1px solid var(--d-border);}
.dist-table th:first-child{text-align:left;padding-left:13px;}
.dist-table td{padding:10px 4px;text-align:center;border-bottom:1px solid var(--d-border);font-weight:600;color:var(--d-text);}
.dist-table td:first-child{text-align:left;padding-left:13px;font-weight:700;font-size:12px;}
.dist-table tbody tr:active{background:rgba(67,160,71,.05);}
.dist-table tbody tr:last-child td{border-bottom:none;}
.dist-table tr.dist-total{background:#fafbfc;}
.dist-table tr.dist-total td{font-weight:800;}
.dist-table tr.dist-total td:first-child{color:var(--d-green2);text-transform:uppercase;letter-spacing:.04em;font-size:10px;}
.cell-ee{color:#1f7a30;}
.cell-me{color:#1e6091;}
.cell-ae{color:#9a4d0c;}
.cell-be{color:#9b2c2c;}
.cell-mean{font-weight:800;letter-spacing:-.01em;}
.cell-mean.high{color:#1f7a30;}
.cell-mean.mid{color:#9a4d0c;}
.cell-mean.low{color:#9b2c2c;}
.subj-tag{display:inline-flex;align-items:center;justify-content:center;width:23px;height:23px;border-radius:6px;background:linear-gradient(135deg,var(--d-green3),var(--d-green2));color:#fff;font-size:9px;margin-right:7px;vertical-align:middle;font-weight:800;}
.dist-legend{padding:9px 13px;display:flex;gap:11px;flex-wrap:wrap;border-top:1px solid var(--d-border);background:#fafbfc;font-size:9.5px;color:var(--d-muted);font-weight:700;}
.dist-legend .lg{display:flex;align-items:center;gap:4px;}
.dist-legend .dot{width:7px;height:7px;border-radius:50%;}
.dot.ee{background:#2fb344;}.dot.me{background:#4299e1;}.dot.ae{background:#f76707;}.dot.be{background:#d63939;}

/* Trend chart */
.trend-card{padding:14px 15px;}
.trend-row{display:grid;grid-template-columns:74px 1fr 56px;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--d-border);}
.trend-row:last-of-type{border-bottom:none;}
.trend-lbl{font-size:11.5px;font-weight:700;color:var(--d-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.trend-bars{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;height:28px;align-items:end;}
.trend-bar{background:linear-gradient(180deg,var(--d-green3),var(--d-green2));border-radius:3px 3px 1px 1px;min-height:4px;}
.trend-bar.cur{box-shadow:0 0 0 1.5px var(--d-green2);}
.trend-bar.empty{background:#e8ecf0;}
.trend-val{font-size:12.5px;font-weight:800;color:var(--d-text);text-align:right;letter-spacing:-.02em;}
.trend-arr{font-size:9px;font-weight:800;margin-left:2px;}
.trend-arr.up{color:#1f7a30;}.trend-arr.down{color:#9b2c2c;}.trend-arr.flat{color:#98a2b3;}
.trend-axis{display:grid;grid-template-columns:74px 1fr 56px;gap:9px;margin-top:5px;padding-top:7px;border-top:1px dashed var(--d-border);}
.trend-axis .xl{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;}
.trend-axis .xl span{font-size:8px;color:#98a2b3;text-align:center;font-weight:700;}
.trend-axis .xl span.cur{color:var(--d-green2);}

/* Class vs School */
.cvs-row{display:grid;grid-template-columns:78px 1fr 52px;align-items:center;gap:9px;padding:11px 14px;border-bottom:1px solid var(--d-border);}
.cvs-row:last-of-type{border-bottom:none;}
.cvs-subj{font-size:11.5px;font-weight:700;color:var(--d-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cvs-bars{display:flex;flex-direction:column;gap:4px;}
.cvs-track{height:8px;background:var(--d-bg);border-radius:99px;overflow:hidden;border:1px solid var(--d-border);}
.cvs-bar{height:100%;border-radius:99px;}
.cvs-bar.you{background:linear-gradient(90deg,var(--d-green3),var(--d-green2));}
.cvs-bar.school{background:linear-gradient(90deg,#cbd5e0,#9aa6b5);}
.cvs-delta{font-size:11px;font-weight:800;text-align:right;letter-spacing:-.02em;}
.cvs-delta.up{color:#1f7a30;}.cvs-delta.down{color:#9b2c2c;}.cvs-delta.flat{color:#98a2b3;}
.cvs-legend{padding:9px 14px;display:flex;gap:14px;border-top:1px solid var(--d-border);background:#fafbfc;font-size:9.5px;color:var(--d-muted);font-weight:700;}
.cvs-legend .lg{display:flex;align-items:center;gap:5px;}
.cvs-legend .sw{width:13px;height:7px;border-radius:99px;}
.sw.you{background:linear-gradient(90deg,var(--d-green3),var(--d-green2));}
.sw.school{background:linear-gradient(90deg,#cbd5e0,#9aa6b5);}

/* Subject Champions */
.champ-block{padding:11px 14px;border-bottom:1px solid var(--d-border);}
.champ-block:last-of-type{border-bottom:none;}
.champ-subj{font-size:11px;font-weight:700;color:#324054;display:flex;align-items:center;margin-bottom:8px;letter-spacing:-.005em;}
.champ-podium{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.podium{background:var(--d-bg);border:1px solid var(--d-border);border-radius:10px;padding:8px 5px;text-align:center;}
.podium.gold{background:linear-gradient(160deg,rgba(255,193,7,.14),rgba(255,193,7,.04));border-color:rgba(255,193,7,.4);}
.podium.silver{background:linear-gradient(160deg,rgba(148,163,184,.14),rgba(148,163,184,.04));border-color:rgba(148,163,184,.35);}
.podium.bronze{background:linear-gradient(160deg,rgba(180,120,60,.12),rgba(180,120,60,.03));border-color:rgba(180,120,60,.3);}
.podium .medal{font-size:14px;}
.podium .p-name{font-size:9.5px;font-weight:700;color:var(--d-text);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.podium .p-score{font-size:11.5px;font-weight:800;color:var(--d-green2);letter-spacing:-.02em;margin-top:1px;}

/* Learners Watchlist */
.watch-item{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid var(--d-border);cursor:pointer;}
.watch-item:last-of-type{border-bottom:none;}
.watch-item:active{background:rgba(214,57,57,.04);}
.watch-av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex-shrink:0;letter-spacing:-.02em;}
.watch-av.high{background:linear-gradient(135deg,#dc2626,#d63939);}
.watch-av.mid{background:linear-gradient(135deg,#dd6b20,#f76707);}
.watch-tx{flex:1;min-width:0;}
.watch-name{font-size:12.5px;font-weight:700;color:var(--d-text);letter-spacing:-.01em;}
.watch-reason{font-size:10px;color:var(--d-muted);margin-top:2px;}
.watch-reason .area{font-weight:700;color:#324054;}
.watch-flag{font-size:10px;font-weight:800;padding:4px 8px;border-radius:99px;flex-shrink:0;background:rgba(247,103,7,.12);color:#a04404;letter-spacing:-.01em;}
.watch-viz{display:flex;align-items:flex-end;gap:2px;height:24px;flex-shrink:0;}
.watch-viz .wb{width:5px;background:#cbd5e0;border-radius:2px 2px 1px 1px;min-height:3px;}
.watch-viz .wb.down{background:#e8a0a0;}
.watch-viz .wb.last{background:#d63939;}
.watch-band{display:flex;align-items:center;gap:3px;flex-shrink:0;}
.watch-band .bb{font-size:9px;font-weight:800;padding:3px 6px;border-radius:6px;}
.watch-band .arr{font-size:9px;color:#d63939;font-weight:800;}
.bd-ee{background:rgba(47,179,68,.14);color:#1f7a30;}
.bd-me{background:rgba(66,153,225,.14);color:#1e6091;}
.bd-ae{background:rgba(247,103,7,.14);color:#a04404;}
.bd-be{background:rgba(214,57,57,.12);color:#9b2c2c;}

/* Home empty cell */
.h-empty{padding:26px 18px;text-align:center;color:var(--d-muted);font-size:12px;line-height:1.5;}
.h-empty i{font-size:28px;color:#cbd5e0;margin-bottom:8px;display:block;}

/* ═══════════════════════════════════════════════════════════════════
   REPORTS v2 — Hub + polished picker + preview actions
   ═══════════════════════════════════════════════════════════════════ */
.rep-hub-context{background:linear-gradient(135deg,var(--d-green2),var(--d-green) 130%);color:#fff;border-radius:14px;padding:13px 15px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 20px -10px rgba(27,94,32,.5);margin-bottom:6px;}
.rep-hub-context i{font-size:15px;opacity:.85;}
.rep-hub-context .t{font-size:12.5px;font-weight:700;}
.rep-hub-context .s{font-size:10.5px;opacity:.8;font-weight:500;margin-top:1px;}
.rep-type-card{width:100%;background:#fff;border:1px solid var(--d-border);border-radius:15px;padding:15px;box-shadow:var(--d-card-shadow);cursor:pointer;margin-bottom:11px;display:flex;align-items:center;gap:13px;font-family:inherit;text-align:left;color:var(--d-text);transition:all .2s cubic-bezier(.4,0,.2,1);}
.rep-type-card:active{transform:scale(.99);box-shadow:var(--d-card-shadow-hover);}
.rep-type-card.soon{opacity:.72;}
.rep-type-icon{width:48px;height:48px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff;flex-shrink:0;box-shadow:0 4px 12px -2px rgba(0,0,0,.18);}
.rep-type-icon.t1{background:linear-gradient(135deg,#2b6cb0,#3182ce);}
.rep-type-icon.t2{background:linear-gradient(135deg,var(--d-green2),var(--d-green3));}
.rep-type-icon.t3{background:linear-gradient(135deg,var(--d-gold2),var(--d-gold));}
.rep-type-icon.t4{background:linear-gradient(135deg,#6b46c1,#805ad5);}
.rep-type-info{flex:1;min-width:0;}
.rep-type-name{font-size:14.5px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:7px;}
.rep-type-soon{font-size:8.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;background:#eef1f4;color:var(--d-muted);padding:2px 6px;border-radius:5px;}
.rep-type-desc{font-size:11px;color:var(--d-muted);font-weight:500;margin-top:2px;line-height:1.4;}
.rep-type-meta{font-size:10px;color:var(--d-green2);font-weight:700;margin-top:5px;}
.rep-type-chev{color:var(--d-muted-2);font-size:13px;flex-shrink:0;}

/* Polished filter bar (term dropdown + assessment segmented) */
.rep-filter-bar{display:flex;gap:8px;margin-bottom:12px;}
.rep-filter-dd{flex:1;position:relative;min-width:0;}
.rep-filter-dd select{width:100%;appearance:none;-webkit-appearance:none;background:#fff;border:1px solid var(--d-border);border-radius:11px;padding:10px 28px 10px 12px;font-family:inherit;font-size:12px;font-weight:700;color:var(--d-text);cursor:pointer;box-shadow:var(--d-card-shadow);}
.rep-filter-dd::after{content:'\f078';font-family:'Font Awesome 6 Free';font-weight:900;position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:9px;color:var(--d-muted);pointer-events:none;}
.rep-assess-seg{display:flex;background:#fff;border:1px solid var(--d-border);border-radius:11px;padding:3px;gap:3px;box-shadow:var(--d-card-shadow);flex:1.4;}
.rep-assess-seg button{flex:1;border:none;background:transparent;padding:8px 4px;border-radius:8px;font-family:inherit;font-size:11px;font-weight:700;color:var(--d-muted);cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1);}
.rep-assess-seg button.active{background:linear-gradient(135deg,var(--d-green2),var(--d-green3));color:#fff;}

/* Picker learner list */
.rep-list-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px;font-size:11px;font-weight:700;color:var(--d-muted);text-transform:uppercase;letter-spacing:.05em;}
.rep-ready-count{color:var(--d-green2);}
.rep-learner-list{display:flex;flex-direction:column;gap:8px;}
.rep-learner-row{width:100%;background:#fff;border:1px solid var(--d-border);border-radius:12px;padding:11px 13px;box-shadow:var(--d-card-shadow);display:flex;align-items:center;gap:11px;cursor:pointer;font-family:inherit;text-align:left;color:var(--d-text);transition:all .2s cubic-bezier(.4,0,.2,1);}
.rep-learner-row:active{transform:scale(.99);}
.rep-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--d-green3),var(--d-green2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;flex-shrink:0;letter-spacing:-.02em;}
.rep-who{flex:1;min-width:0;}
.rep-who-name{font-size:13.5px;font-weight:700;color:var(--d-text);letter-spacing:-.01em;}
.rep-who-adm{font-size:10.5px;color:var(--d-muted);font-weight:500;margin-top:1px;}
.rep-status{font-size:9px;font-weight:800;padding:4px 8px;border-radius:99px;letter-spacing:.03em;text-transform:uppercase;flex-shrink:0;}
.rep-status.ready{background:rgba(47,179,68,.13);color:#1f7a30;}
.rep-status.partial{background:rgba(247,103,7,.13);color:#a04404;}
.rep-chev{color:var(--d-muted-2);font-size:12px;flex-shrink:0;}

/* Picker multi-select */
.rep-selectall{border:1px solid var(--d-border);background:#fff;color:var(--d-green2);font-family:inherit;font-size:10.5px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;padding:5px 10px;border-radius:99px;cursor:pointer;}
.rep-selectall:active{transform:scale(.96);}
.rep-check{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--d-border-strong);background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s cubic-bezier(.4,0,.2,1);}
.rep-check i{font-size:11px;color:#fff;opacity:0;transform:scale(.5);transition:all .15s cubic-bezier(.34,1.56,.64,1);}
.rep-learner-row.selected{border-color:var(--d-green3);background:rgba(67,160,71,.05);}
.rep-learner-row.selected .rep-check{background:linear-gradient(135deg,var(--d-green2),var(--d-green3));border-color:var(--d-green2);}
.rep-learner-row.selected .rep-check i{opacity:1;transform:scale(1);}
.rep-build-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + var(--f7-safe-area-bottom));width:100%;max-width:480px;z-index:50;background:rgba(255,255,255,.97);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);border-top:1px solid var(--d-border);box-shadow:0 -6px 20px rgba(15,23,42,.08);padding:10px 14px;display:flex;align-items:center;gap:12px;}
.rep-build-info{flex:0 0 auto;font-size:12px;font-weight:700;color:var(--d-text-2);}
.rep-build-info span{color:var(--d-green2);font-weight:800;}
.rep-build-btn{flex:1;border:none;border-radius:12px;padding:13px 16px;font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--d-green2),var(--d-green3));color:#fff;box-shadow:0 6px 16px rgba(46,125,50,.3);}
.rep-build-btn:disabled{opacity:.45;box-shadow:none;}
.rep-build-btn:not(:disabled):active{transform:scale(.98);}
.page-content:has(.rep-build-bar){padding-bottom:calc(150px + var(--f7-safe-area-bottom));}

/* Preview actions */
.rep-actions{display:flex;gap:9px;margin-bottom:12px;}
.rep-action-btn{flex:1;border:none;border-radius:12px;padding:12px;font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;}
.rep-action-btn.primary{background:linear-gradient(135deg,var(--d-green2),var(--d-green3));color:#fff;box-shadow:0 6px 16px rgba(46,125,50,.3);}
.rep-action-btn.ghost{background:#fff;border:1px solid var(--d-border);color:var(--d-text-2);box-shadow:var(--d-card-shadow);}
.rep-action-btn:active{transform:scale(.98);}
.rep-sheet-wrap{margin:0 -2px;}
.rep-batch-count{font-size:11px;font-weight:700;color:var(--d-muted);text-align:center;margin-bottom:10px;letter-spacing:.02em;}

/* Print: isolate the report sheet / broadsheet only */
@media print{
  body > *{display:none!important;}
  .rep-sheet-wrap,.rep-sheet-wrap *,.bs-fit-shell,.bs-fit-shell *{display:revert!important;}
  .rep-sheet-wrap,.bs-fit-shell{position:absolute;left:0;top:0;width:100%;margin:0;padding:0;}
  .bs-fit-shell{height:auto!important;overflow:visible!important;}
  .bs-fit-scale{transform:none!important;width:auto!important;}
  .app-tabbar,.navbar,.rep-filter-bar,.rep-actions,.rep-batch-count,.rep-build-bar{display:none!important;}
}
</style>
</head>

<!-- ═══════════════════════════════════════════════════════════════════
     SPLASH (CSS-only, sits above everything until auth resolves)
     ═══════════════════════════════════════════════════════════════════ -->
<div id="splash">
  <div class="splash-orbs"></div>
  <div class="splash-logo" id="splash-logo"><i class="fas fa-graduation-cap"></i></div>
  <div class="splash-name" id="splash-name">Daraja</div>
  <div class="splash-tag">School Portal</div>
  <div class="splash-spinner"></div>
</div>

<!-- ═══════════════════════════════════════════════════════════════════
     LOGIN SCREEN (outside Framework7 app, shown before main app boots)
     ═══════════════════════════════════════════════════════════════════ -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-logo" id="login-logo"><i class="fas fa-graduation-cap"></i></div>
      <div class="login-school-name" id="login-school-name">JOYLAND SCHOOLS</div>
      <div class="login-motto" id="login-motto">Education Is Treasure</div>
    </div>
    <div class="login-title">Welcome back</div>
    <div class="login-sub">Sign in to continue</div>

    <div class="login-alert" id="login-alert"></div>

    <div class="login-tabs">
      <button type="button" data-tab="password" class="active" onclick="switchLoginTab('password')">Password</button>
      <button type="button" data-tab="temp" onclick="switchLoginTab('temp')">Temp Code</button>
    </div>

    <form id="login-form-password" autocomplete="off">
      <div class="login-field">
        <label>Username or Admission No.</label>
        <div class="login-input-wrap">
          <i class="fas fa-user"></i>
          <input type="text" id="login-username" autocomplete="username" required/>
        </div>
      </div>
      <div class="login-field">
        <label>Password</label>
        <div class="login-input-wrap">

<script>
'use strict';
/* ════════════════════════════════════════════════════════════════════
   STATE & HELPERS
   ════════════════════════════════════════════════════════════════════ */
const state = {
  me: null,            // logged-in user
  school: null,        // school info
  dashboard: null,     // teacher dashboard payload
  classes: [],         // teacher's classes
  subjectClasses: [],  // subjects the teacher handles
  notifications: 0,
  liveSync: { source:null, timer:null, noticeAt:0, staleViews:new Set() }
};
const ASSIGNMENT_VIEWS = ['#view-home','#view-attendance','#view-marks','#view-reports','#view-more'];

const api = {
  async get(path){
    const r = await fetch(path, { credentials:'same-origin' });
    const j = await r.json().catch(()=>({}));
    if(!r.ok || j.success === false){ throw new Error(j.message || j.error || ('HTTP '+r.status)); }
    return j.data !== undefined ? j.data : j;
  },
  async post(path, body){
    const r = await fetch(path, {
      method:'POST',
      credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body||{})
    });
    const j = await r.json().catch(()=>({}));
    if(!r.ok || j.success === false){ throw new Error(j.message || j.error || ('HTTP '+r.status)); }
    return j.data !== undefined ? j.data : j;
  },
  async put(path, body){
    const r = await fetch(path, {
      method:'PUT',
      credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body||{})
    });
    const j = await r.json().catch(()=>({}));
    if(!r.ok || j.success === false){ throw new Error(j.message || j.error || ('HTTP '+r.status)); }
    return j.data !== undefined ? j.data : j;
  }
};

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const ASSESSMENT_LABELS = { opener:'Opener', midterm:'Midterm', endterm:'Endterm' };
function marksBandFromPercent(percent){
  if(percent === null || percent === undefined || percent === '' || !Number.isFinite(Number(percent))) return { code:'-', cls:'none', label:'Pending' };
  const p = Number(percent);
  if(p >= 75) return { code:'EE', cls:'ee', label:'Exceeding' };
  if(p >= 50) return { code:'ME', cls:'me', label:'Meeting' };
  if(p >= 30) return { code:'AE', cls:'ae', label:'Approaching' };
  return { code:'BE', cls:'be', label:'Below' };
}
function subjectAbbr(name){
  const words = String(name || '').replace(/[^a-z0-9\s]/gi,' ').trim().split(/\s+/).filter(Boolean);
  const stop = new Set(['and','of','the','a','an','in']);
  const useful = words.filter(w=>!stop.has(w.toLowerCase()));
  if(useful.length >= 2) return useful.slice(0,2).map(w=>w[0]).join('').toUpperCase();
  const first = useful[0] || words[0] || 'S';
  return first.slice(0,2).toUpperCase();
}

function todayLocal(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function shiftIsoDate(value, delta){
  const d = new Date(`${value}T00:00:00`);
  d.setDate(d.getDate() + delta);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function toast(message, type=''){
  if(app?.toast){
    app.toast.create({
      text: message,
      closeTimeout: 2600,
      cssClass: type === 'error' ? 'color-red' : type === 'success' ? 'color-green' : ''
    }).open();
  }else{
    console.log(message);
  }
}

function setTeacherDashboardState(dash){
  const data = dash || {};
  const attendance = data.today_attendance || {};
  state.dashboard = data;
  state.classes = (data.my_classes || data.classes || []).map(c => ({
    ...c,
    learner_count: c.learner_count ?? c.enrollment_count ?? 0,
    attendance_marked_today: !!attendance[c.id],
    is_class_teacher: true
  }));
  state.subjectClasses = (data.subject_classes || []).map(s => ({
    ...s,
    learner_count: s.learner_count ?? s.enrollment_count ?? 0
  }));
  return data;
}

function switchLoginTab(tab){
  document.querySelectorAll('.login-tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab===tab));
  document.getElementById('login-form-password').hidden = tab !== 'password';
  document.getElementById('login-form-temp').hidden = tab !== 'temp';
}
function togglePwd(){
  const p = document.getElementById('login-password');
  const i = document.querySelector('.eye-btn i');
  if(p.type==='password'){ p.type='text'; i.className='fas fa-eye-slash'; }
  else { p.type='password'; i.className='fas fa-eye'; }
}
function showLoginAlert(msg){
  const a = document.getElementById('login-alert');
  a.textContent = msg;
  a.classList.add('show','error');
  setTimeout(()=>a.classList.remove('show'), 4500);
}

document.getElementById('login-form-password').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('login-submit');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>Signing in...</span>';
  try {
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;
    const result = await api.post('/api/auth/login', { identifier: username, password });
    if(result?.role && result.role !== 'teacher'){
      location.href = '/app/';
      return;
    }
    await bootMainApp();
  } catch(err){
    showLoginAlert(err.message || 'Sign-in failed. Check your credentials.');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i><span>Sign In</span>';
  }
});

document.getElementById('login-form-temp').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    const identifier = (document.getElementById('login-temp-identifier').value || document.getElementById('login-username').value || '').trim();
    const code = document.getElementById('login-temp-code').value.trim();
    const result = await api.post('/api/auth/temp-login', { identifier, temp_code: code });
    if(result?.role && result.role !== 'teacher'){
      location.href = '/app/';
      return;
    }
    await bootMainApp();
  } catch(err){
    showLoginAlert(err.message || 'Code is invalid or expired.');
  }
});

  if(root) root.innerHTML = html;
}

function setHomeTitles(title){
  const homeTitle = document.getElementById('home-title');
  const schoolTitle = document.getElementById('home-school-title');

  if(schoolTitle) schoolTitle.textContent = title;

async function renderHomeDashboard(){
  try {
    const f = state.homeFilters || {};
    const qs = new URLSearchParams();
    if(f.term_id) qs.set('term_id', f.term_id);
    if(f.assessment_type) qs.set('assessment_type', f.assessment_type);
    if(f.class_id) qs.set('class_id', f.class_id);
    const data = await api.get('/api/teacher/home' + (qs.toString() ? ('?' + qs.toString()) : ''));
    state.home = data;
    setHomeTitles(state.school?.school_name || state.school?.name || 'Daraja');

    const firstName = (state.me?.name || state.me?.full_name || 'Teacher').split(' ')[0];

    if(data.empty){
      setHomeContent(`
        <div class="hero"><div style="position:relative;z-index:1;">
          <div class="hero-greeting">${esc(greetingForTime())},</div>
          <div class="hero-name">${esc(firstName)} 👋</div>
        </div></div>
        <div class="h-empty" style="margin-top:34px;"><i class="fas fa-calendar-xmark"></i>${esc(data.message || 'No academic data configured yet.')}</div>
      `);
      return;
    }

    const ctx = data.context || {};
    setHomeContent(
      homeHero(firstName, ctx) +
      homeMetrics(data.metrics || {}) +
      homeSticky(data.filters || {}, ctx) +
      homePanels(data)
    );
    homeSetSegment(state.homeSegment || 'today');
  } catch(err){
    setHomeContent(`
      <div class="coming-soon">
        <div class="icon-circle"><i class="fas fa-triangle-exclamation"></i></div>
        <h3>Couldn't load dashboard</h3>
        <p>${esc(err.message||'Try again')}</p>
        <button class="mini-btn" style="margin-top:16px;" onclick="renderHomeDashboard()">Retry</button>
      </div>
    `);
  }
}

/* ─── Home builders ─────────────────────────────────────────────── */
function homeHero(firstName, ctx){
  const term = ctx.term || {};
  const chips = [];
  if(term.name){
    chips.push(`<span class="d-chip"><i class="fas fa-calendar"></i> ${esc(term.name)}${term.session_year ? (' · ' + esc(term.session_year)) : ''}</span>`);
  }
  if(ctx.assessment_label){
    chips.push(`<span class="d-chip gold"><i class="fas fa-bullseye"></i> ${esc(ctx.assessment_label)}</span>`);
  }
  return `
    <div class="hero">
      <div style="position:relative;z-index:1;">
        <div class="hero-greeting">${esc(greetingForTime())},</div>
        <div class="hero-name">${esc(firstName)} 👋</div>
        <div class="hero-chips">${chips.join('')}</div>
      </div>
    </div>
  `;
}

function homeMetrics(m){
  function card(cls, icon, valHtml, label, delta){
    let d = '';
    if(delta != null && delta !== 0){
      const up = delta > 0;
      d = `<div class="mc-delta ${up?'up':'down'}"><i class="fas fa-arrow-${up?'up':'down'}"></i>${Math.abs(delta)}</div>`;
    }
    return `<div class="metric-card ${cls}">${d}<div class="mc-icon"><i class="fas fa-${icon}"></i></div><div class="mc-v">${valHtml}</div><div class="mc-l">${label}</div></div>`;
  }
  const mean = m.my_mean || {};
  const att = m.attendance || {};
  const rank = m.rank;
  const pending = m.pending || {};
  return `<div class="metric-grid">
    ${card('mc-green', 'chart-line', mean.value!=null?`${mean.value}<small>%</small>`:'—', 'My Mean', mean.delta)}
    ${card('mc-blue', 'user-check', att.value!=null?`${att.value}<small>%</small>`:'—', 'Attendance', att.delta)}
    ${card('mc-gold', 'trophy', rank?`#${rank.value}`:'—', 'Rank', null)}
    ${card('mc-orange', 'clock', String(pending.value!=null?pending.value:0), 'Pending', null)}
  </div>`;
}

function homeSticky(filters, ctx){
  const terms = filters.terms || [];
  const assessments = filters.assessments || [];
  const classes = filters.classes || [];
  const termOpts = terms.map(t =>
    `<option value="${t.id}" ${String(t.id)===String(ctx.term&&ctx.term.id)?'selected':''}>${esc(t.label)}</option>`
  ).join('');
  const aOpts = assessments.map(a =>
    `<option value="${a.value}" ${a.value===ctx.assessment?'selected':''}>${esc(a.label)}</option>`
  ).join('');
  const cOpts = `<option value="">All Classes</option>` + classes.map(c =>
    `<option value="${c.id}" ${String(c.id)===String(ctx.class_id||'')?'selected':''}>${esc(c.name)}</option>`
  ).join('');
  return `
    <div class="home-sticky">
      <div class="seg-control">
        <button class="seg-btn" data-seg="today" onclick="homeSetSegment('today')"><i class="fas fa-bolt"></i> Today</button>
        <button class="seg-btn" data-seg="performance" onclick="homeSetSegment('performance')"><i class="fas fa-chart-bar"></i> Performance</button>
        <button class="seg-btn" data-seg="learners" onclick="homeSetSegment('learners')"><i class="fas fa-users"></i> Learners</button>
      </div>
      <div class="filter-bar hidden" id="home-filter">
        <div class="filter-dd"><select id="hf-term" onchange="homeFilterChange()">${termOpts}</select></div>
        <div class="filter-dd"><select id="hf-assessment" onchange="homeFilterChange()">${aOpts}</select></div>
        <div class="filter-dd"><select id="hf-class" onchange="homeFilterChange()">${cOpts}</select></div>
      </div>
    </div>
  `;
}

function homePanels(data){
  return `
    <div class="seg-panel" data-seg="today">
      ${homeInsights(data.insights || [])}
      ${homeCompletion(data.marking_progress || {})}
      ${homePending(data.pending_tasks || [])}
      <div style="height:14px;"></div>
    </div>
    <div class="seg-panel" data-seg="performance">
      ${homeDistribution(data.distribution || {})}
      ${homeTrend(data.trend || {})}
      ${homeClassVsSchool(data.class_vs_school || [])}
      <div style="height:14px;"></div>
    </div>
    <div class="seg-panel" data-seg="learners">
      ${homeChampions(data.champions || [])}
      ${homeWatchlist(data.watchlist || [])}
      <div style="height:14px;"></div>
    </div>
  `;
}

function homeSetSegment(name){
  state.homeSegment = name;
  document.querySelectorAll('.seg-btn').forEach(b => b.classList.toggle('active', b.dataset.seg === name));
  document.querySelectorAll('.seg-panel').forEach(p => p.classList.toggle('active', p.dataset.seg === name));
  const filter = document.getElementById('home-filter');
  if(filter) filter.classList.toggle('hidden', name === 'today');
}

function homeFilterChange(){
  const term = document.getElementById('hf-term');
  const assessment = document.getElementById('hf-assessment');
  const cls = document.getElementById('hf-class');

/* ─── Widget renderers ──────────────────────────────────────────── */
function subjAbbr(code, name){
  // Use the code only if it looks like a real short code (not a system-generated junk code)
  const c = String(code||'').trim();
  if(c && c.length <= 5 && !/^SYS/i.test(c)) return c.toUpperCase();
  // Otherwise derive initials from the subject name, skipping stop-words
  const stop = new Set(['and','of','the','a','an','in','for','to','&']);
  const words = String(name||'?').replace(/[^a-zA-Z ]/g,'').trim().split(/\s+/)
    .filter(w => w && !stop.has(w.toLowerCase()));
  if(words.length >= 2) return (words[0][0] + words[1][0]).toUpperCase();
  if(words.length === 1) return words[0].slice(0,2).toUpperCase();
  return (String(name||'?').replace(/[^a-zA-Z]/g,'').slice(0,2).toUpperCase()) || '?';
}
function meanClass(m){
  if(m == null) return '';
  if(m >= 65) return 'high';
  if(m >= 45) return 'mid';
  return 'low';
}
function compactName(name){
  const parts = String(name||'').trim().split(/\s+/).filter(Boolean);
  if(parts.length <= 1) return parts[0] || '—';
  return parts[0] + ' ' + parts[parts.length-1][0] + '.';
}

    </div>`;
  }
  const curIdx = trend.current_index != null ? trend.current_index : (labels.length - 1);
  const rows = subjects.map(s => {
    const pts = s.points || [];
    const bars = pts.map((p, i) => {
      if(p == null) return `<div class="trend-bar empty" style="height:18%;"></div>`;
      const h = Math.max(8, Math.min(100, p));
      return `<div class="trend-bar ${i===curIdx?'cur':''}" style="height:${h}%;"></div>`;
    }).join('');
    const arrowCh = s.arrow === 'up' ? '↑' : s.arrow === 'down' ? '↓' : '→';
    return `

        <div class="trend-lbl">${esc(s.subject_name)}</div>

        <div class="trend-val">${s.current!=null?s.current:'—'}<span class="trend-arr ${esc(s.arrow||'flat')}">${arrowCh}</span></div>
