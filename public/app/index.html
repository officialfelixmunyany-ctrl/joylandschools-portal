<!DOCTYPE html>
<html lang="en" class="auto-theme">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#14532d"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="format-detection" content="telephone=no"/>
<title>Daraja</title>
<link rel="icon" href="/uploads/school/logo.jpg"/>
<link rel="apple-touch-icon" href="/uploads/school/logo.jpg"/>
<link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css"/>
<link rel="stylesheet" href="/app/daraja.css"/>
</head>
<body>

<!-- Splash -->
<div id="splash">
  <div class="splash-logo" id="splash-logo"><i class="fas fa-graduation-cap" style="font-size:44px;color:var(--brand-600);"></i></div>
  <div class="splash-name" id="splash-name">Daraja</div>
  <div class="splash-tag">Education is Treasure</div>
  <div class="splash-dots"><i></i><i></i><i></i></div>
</div>

<!-- App frame -->
<div id="app" hidden>
  <div class="screens" id="screens"></div>
  <div class="tabbar hide" id="tabbar">
    <div class="tabbar-inner" id="tabbar-inner"></div>
  </div>
</div>

<div class="toast-wrap" id="toast-wrap"></div>
<div class="shroud" id="shroud" onclick="UI.closeSheet()"></div>

<script src="/app/daraja.js"></script>
</body>
</html>
