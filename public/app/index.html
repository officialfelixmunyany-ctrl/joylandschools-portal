function hasUnsavedAppWork(){
  return !!(
    window.f7Attendance?.dirty ||
    window.f7Marks?.dirty ||
    window.f7Skills?.dirty ||
    window.f7Comments?.dirty
  );
}

function activeViewSelector(){
  const active = document.querySelector('.views > .view.tab-active');
  return active?.id ? `#${active.id}` : '#view-home';
}

function reloadView(selector){
  if(!app?.views) return;
  if(selector === '#view-home'){
    renderHomeDashboard();
    return;
  }
  const view = app.views.get(selector);
  const fallbackUrl = document.querySelector(selector)?.dataset?.url || '/';
  const url = view?.router?.currentRoute?.url || fallbackUrl;
  if(view?.router && url){
    view.router.navigate(url, { reloadCurrent:true, ignoreCache:true, animate:false });
  }
}

function reloadActiveView(){
  reloadView(activeViewSelector());
}

function currentViewUrl(selector=activeViewSelector()){
  const view = app?.views?.get?.(selector);
  return view?.router?.currentRoute?.url || document.querySelector(selector)?.dataset?.url || '/';
}

function navigateView(selector, url, activate=true){
  if(activate){
    navTab(selector, url);
    return;
  }
  const view = app?.views?.get?.(selector);
  if(view?.router) view.router.navigate(url, { reloadCurrent:true, ignoreCache:true, animate:false });
}

function ownsClass(classId){
  return (state.classes || []).some(c => String(c.id) === String(classId));
}

function ownsSubjectPair(classId, subjectId){
  return (state.subjectClasses || []).some(s =>
    String(s.class_id) === String(classId) && String(s.subject_id) === String(subjectId)
  );
}

function fallbackUrlForView(selector){
  if(selector === '#view-attendance') return '/attendance/';
  if(selector === '#view-marks') return '/marks/';
  if(selector === '#view-reports') return '/reports/';
  if(selector === '#view-more') return '/more/';
  return '/';
}

function markAssignmentViewsStale(includeActive=true){
  ASSIGNMENT_VIEWS.forEach(selector => {
    if(!includeActive && selector === activeViewSelector()) return;
    state.liveSync.staleViews.add(selector);
  });
}

function refreshStaleAssignmentView(selector){
  if(!state.liveSync.staleViews.has(selector)) return;
  if(selector === activeViewSelector() && hasUnsavedAppWork()) return;
  state.liveSync.staleViews.delete(selector);
  if(enforceLatestAssignments(selector, selector === activeViewSelector())) return;
  reloadView(selector);
}

function setupAssignmentTabRefresh(){
  document.querySelectorAll('.app-tabbar .tab-link').forEach(link => {
    link.addEventListener('click', () => {
      const selector = link.getAttribute('href');
      setTimeout(() => refreshStaleAssignmentView(selector), 80);
    });
  });
}

function enforceLatestAssignments(selector=activeViewSelector(), activate=true){
  const cleanUrl = currentViewUrl(selector).split('?')[0];

  const attendance = cleanUrl.match(/^\/attendance\/(\d+)\/(?:history\/)?$/);
  if(attendance && !ownsClass(attendance[1])){
    window.f7Attendance = null;
    navigateView('#view-attendance', '/attendance/', activate);
    if(activate) toast((state.classes || []).length ? 'Class assignment updated' : 'No classes assigned');
    return true;
  }

  const marks = cleanUrl.match(/^\/marks\/(\d+)\/(\d+)\/$/);
  if(marks && !ownsSubjectPair(marks[1], marks[2])){
    window.f7Marks = null;
    navigateView('#view-marks', '/marks/', activate);
    if(activate) toast((state.subjectClasses || []).length ? 'Subject assignment updated' : 'No subjects assigned');
    return true;
  }

  const classOnly = cleanUrl.match(/^\/classes\/(\d+)\/learners\/$/)
    || cleanUrl.match(/^\/reports\/class\/(\d+)(?:\/.*)?$/)
    || cleanUrl.match(/^\/(?:skills|comments)\/class\/(\d+)\/$/);
  if(classOnly && !ownsClass(classOnly[1])){
    window.f7Skills = null;
    window.f7Comments = null;
    navigateView(selector, fallbackUrlForView(selector), activate);
    if(activate) toast((state.classes || []).length ? 'Class assignment updated' : 'No classes assigned');
    return true;
  }

  return false;
}

function refreshAssignmentViews(includeActive=true){
  markAssignmentViewsStale(includeActive);
  refreshStaleAssignmentView(activeViewSelector());
}

async function refreshAppShell(){
  const [school, dash] = await Promise.all([
    api.get('/api/school-info').catch(()=>null),
    api.get('/api/teacher/dashboard').catch(()=>null)
  ]);
  if(school){
    state.school = school;
    const schoolTitle = document.getElementById('home-school-title');
    if(schoolTitle) schoolTitle.textContent = school.school_name || school.name || 'Daraja';
  }
  if(dash) setTeacherDashboardState(dash);
}

function scheduleLiveRefresh(payload){
  clearTimeout(state.liveSync.timer);
  state.liveSync.timer = setTimeout(() => handleLiveRefresh(payload), 450);
}

async function handleLiveRefresh(payload){
  if(!state.me) return;
  await refreshAppShell();
  const assignmentChange = ['class-data','people'].includes(payload?.kind);
  if(assignmentChange){
    if(enforceLatestAssignments()) {
      refreshAssignmentViews(false);
      return;
    }
    if(hasUnsavedAppWork()){
      refreshAssignmentViews(false);
      const now = Date.now();
      if(now - state.liveSync.noticeAt > 6000){
        toast('Portal updated. Save your changes, then refresh this screen.');
        state.liveSync.noticeAt = now;
      }
      return;
    }
    refreshAssignmentViews(true);
    const now = Date.now();
    if(now - state.liveSync.noticeAt > 6000){
      toast('Assignments updated', 'success');
      state.liveSync.noticeAt = now;
    }
    return;
  }
  if(hasUnsavedAppWork()){
    const now = Date.now();
    if(now - state.liveSync.noticeAt > 6000){
      toast('Portal updated. Save your changes, then refresh this screen.');
      state.liveSync.noticeAt = now;
    }
    return;
  }
  if(enforceLatestAssignments()) return;
  reloadActiveView();
  const now = Date.now();
  if(now - state.liveSync.noticeAt > 6000 && payload?.kind !== 'general'){
    toast('Updated from portal', 'success');
    state.liveSync.noticeAt = now;
  }
}

function startLiveSync(){
  if(state.liveSync.source || !window.EventSource) return;
  const source = new EventSource('/api/events');
  source.addEventListener('portal-update', event => {
    let payload = {};
    try { payload = JSON.parse(event.data || '{}'); } catch(_){}
    scheduleLiveRefresh(payload);
  });
  source.onerror = () => {
    // EventSource reconnects on its own when the server comes back.
  };
  state.liveSync.source = source;
}

function stopLiveSync(){
  clearTimeout(state.liveSync.timer);
  if(state.liveSync.source){
    state.liveSync.source.close();
    state.liveSync.source = null;
  }
}

async function loadMarksSubjectProgress(row, assessment){
  const [componentsData, marksData] = await Promise.all([
    api.get(`/api/teacher/assessment-components?class_id=${row.classId}&subject_id=${row.subjectId}&assessment_type=${assessment}`),
    api.get(`/api/teacher/marks?class_id=${row.classId}&subject_id=${row.subjectId}&assessment_type=${assessment}`)
  ]);
  const components = componentsData.components || [];
  const entries = marksData.entries || {};
  const totalCells = row.learners * components.length;
  let doneCells = 0, scoredCells = 0, notSatCells = 0;
  const learnerTotals = {};
  Object.keys(entries).forEach(lid => {
    components.forEach(c => {
      if(Object.prototype.hasOwnProperty.call(entries[lid] || {}, c.component_key)){
        const v = entries[lid][c.component_key];
        doneCells++;
        if(v === null){ notSatCells++; return; }
        const n = Number(v);
        if(Number.isFinite(n)){
          scoredCells++;
          learnerTotals[lid] = learnerTotals[lid] || { score:0, max:0 };
          learnerTotals[lid].score += n;
          learnerTotals[lid].max += Number(c.max_score || 0);
        }
      }
    });
  });
  const percents = Object.values(learnerTotals).filter(x=>x.max>0).map(x=>Math.round((x.score/x.max)*100));
  const mean = percents.length ? Math.round(percents.reduce((a,b)=>a+b,0)/percents.length) : null;
  const status = !totalCells ? 'empty' : doneCells >= totalCells ? 'done' : doneCells > 0 ? 'progress' : 'empty';
  return { ...row, components, totalCells, doneCells, scoredCells, notSatCells, mean, status };
}

function marksSubjectCard(r, assessment, i=0){
  const pct = r.totalCells ? Math.round((Number(r.doneCells || 0) / r.totalCells) * 100) : 0;
  const status = r.status || 'empty';
  const label = status === 'done' ? 'Complete' : status === 'progress' ? 'In Progress' : 'Not Started';
  const band = marksBandFromPercent(r.mean);
  const code = subjectAbbr(r.subjectCode, r.subjectName || 'Subject');
  return `<button class="marks-subject-card ${status}" onclick="marksGo('/marks/${r.classId}/${r.subjectId}/?assessment=${encodeURIComponent(assessment)}')">
    <div class="marks-subject-top">
      <div class="marks-subject-icon">${esc(code)}</div>
      <div class="marks-subject-info">
        <div class="marks-subject-name">${esc(r.subjectName || 'Subject')}</div>
        <div class="marks-subject-meta">${esc(r.className || '')}${r.learners ? ` - ${r.learners} learners` : ''}</div>
      </div>
      <span class="marks-subject-badge ${status}">${label}</span>
    </div>
    <div class="marks-subject-bottom">
      <div class="marks-progress">
        <div class="marks-progress-track"><div class="marks-progress-fill ${status}" style="width:${pct}%"></div></div>
        <div class="marks-progress-label">${Number(r.doneCells || 0)} of ${Number(r.totalCells || 0)} cells done${r.notSatCells ? ` - ${r.notSatCells} not sat` : ''}</div>
      </div>
      <div class="marks-mean"><div class="v ${band.cls}">${r.mean == null ? '-' : `${r.mean}%`}</div><div class="l">Mean</div></div>
    </div>
  </button>`;
}

function defaultReportTermId(){
  const terms = reportTermList();
  if(!terms.length) return '';
  const today = todayLocal();
  const current = terms.find(t => t.start_date && t.end_date && t.start_date <= today && t.end_date >= today);
  return String((current || terms[terms.length - 1]).id || '');
}

function groupPreviewMarks(rows){
  const grouped = {};
  (rows || []).forEach(m => {
    const learnerId = String(m.learner_id || '');
    const subjectId = String(m.subject_id || '');
    const assessment = String(m.assessment_type || '');
    const component = String(m.component_key || '');
    if(!learnerId || !subjectId || !assessment || !component) return;
    if(!grouped[learnerId]) grouped[learnerId] = {};
    if(!grouped[learnerId][subjectId]) grouped[learnerId][subjectId] = {};
    if(!grouped[learnerId][subjectId][assessment]) grouped[learnerId][subjectId][assessment] = {};
    grouped[learnerId][subjectId][assessment][component] = m.score === null || m.score === undefined || m.score === '' ? null : Number(m.score);
  });
  return grouped;
}

function previewComponentDefs(report){
  const configured = (report.component_defs || []).map((c,i) => ({
    key:c.key || c.component_key || c.name || c.component_name || `component_${i+1}`,
    name:c.name || c.component_name || c.key || c.component_key || `Component ${i+1}`,
    max_score:c.max_score ?? c.max ?? null
  }));
  if(configured.length) return configured;
  const byKey = new Map();
  (report.subjects || []).forEach(s => (s.components || []).forEach(c => {
    const key = c.key || c.component_key || c.name;
    if(key && !byKey.has(key)) byKey.set(key, { key, name:c.name || key, max_score:c.max ?? c.max_score ?? null });
  }));
  return Array.from(byKey.values());
}

async function renderAdminReportPreviewSheet(report){
  const renderer = window.DarajaReportPreview;
  if(!renderer) throw new Error('Report template engine failed to load. Fully close and reopen the app.');
  await renderer.ensureStyles();
  const classId = String(report.class?.id || '');
  const termId = String(report.term?.id || '');
  const schoolSettings = {
    school_name:report.school?.school_name,
    school_motto:report.school?.school_motto,
    school_address:report.school?.school_address,
    school_phone:report.school?.school_phone,
    school_email:report.school?.school_email,
    school_logo:report.school?.school_logo
  };
  const terms = reportTermList().map(t => ({ ...t, label:t.label || t.name || `Term ${t.id}` }));
  renderer.setGlobals({
    classes:[{ ...(report.class || {}), template_name:report.template?.name || report.class?.template_name || 'Default Template' }],
    learners:report.class_learners || [report.learner].filter(Boolean),
    classSubjects:(report.subjects || []).map(s => ({ class_id:classId, subject_id:s.subject_id, subject_name:s.subject_name })),
    terms,
    assessments:Object.entries(ASSESSMENT_LABELS).map(([value,label]) => ({ value, label }))
  });
  const stateTemplate = renderer.normalizeState(report.template?.state || null, schoolSettings, report.template?.name || 'Default Template');
  const componentDefs = previewComponentDefs(report);
  // Single report-card endpoint returns `learner`; the batch endpoint returns `learners` (array).
  const renderLearners = (Array.isArray(report.learners) && report.learners.length)
    ? report.learners
    : [report.learner].filter(Boolean);
  const html = renderer.renderPages({
    state:stateTemplate,
    classId,
    termId,
    assessment:report.assessment_type || 'opener',
    learners:renderLearners,
    subjects:report.subjects || [],
    grouped:groupPreviewMarks(report.all_marks || []),
    componentKeys:componentDefs.map(c => c.key),
    componentDefs,
    componentNames:componentDefs.map(c => c.name),
    strict:true,
    classLearners:report.class_learners || renderLearners,
    attendanceSummary:report.attendance_summary || { opened:report.attendance?.opened || null, learners:{} },
    skillRatings:report.skill_ratings || {}
  });
  return html;
}

async function loadSkillsEntry(classId, assessment='opener'){
  const root = document.getElementById(`skills-work-${classId}`);
  if(!root) return;
  try{
    const [cfg, rosterData, savedData] = await Promise.all([
      api.get(`/api/teacher/skills/config?class_id=${classId}&assessment_type=${assessment}`),
      api.get(`/api/teacher/classes/${classId}/learners`),
      api.get(`/api/teacher/skills?class_id=${classId}&assessment_type=${assessment}`)
    ]);
    const categories = cfg.categories || [];
    const ratings = cfg.ratings || [5,4,3,2,1];
    const learners = rosterData.learners || [];
    const existing = savedData.entries || {};
    window.f7Skills = { classId, assessment, categories, ratings, learners, termId:savedData.term?.id || null, category:categories[0]?.key, item:categories[0]?.items?.[0]?.key, entries:{}, dirty:false };
    learners.forEach(l => {
      window.f7Skills.entries[l.id] = {};
      categories.forEach(cat => {
        window.f7Skills.entries[l.id][cat.key] = {};
        (cat.items || []).forEach(it => {
          const value = existing[l.id]?.[cat.key]?.[it.key] ?? existing[String(l.id)]?.[cat.key]?.[it.key];
          if(value != null) window.f7Skills.entries[l.id][cat.key][it.key] = Number(value);
        });
      });
    });
    root.innerHTML = reportAssessmentTabs(classId, null, assessment).replaceAll("navTab('#view-reports'", "navTab('#view-more'").replaceAll('/reports/class/', '/skills/class/') + `
      <div class="chip-row">${categories.map(cat => `<button class="${cat.key===window.f7Skills.category?'active':''}" onclick="selectSkillCategory('${esc(cat.key)}')">${esc(cat.label)}</button>`).join('')}</div>
      <div class="chip-row" id="skill-items"></div>
      <div id="skill-list"></div>
      <div class="sticky-save"><button class="save-btn" id="skill-save-btn" onclick="saveSkills()">Save Skills</button></div>
    `;
    renderSkillItems();
  }catch(err){
    root.innerHTML = `<div class="empty-card"><i class="fas fa-triangle-exclamation"></i><p>${esc(err.message || 'Could not load skills')}</p></div>`;
  }
}

function currentSkillCategory(){ return (window.f7Skills?.categories || []).find(c => c.key === window.f7Skills.category); }
function currentSkillItem(){ return (currentSkillCategory()?.items || []).find(i => i.key === window.f7Skills.item); }
function selectSkillCategory(key){
  const ctx = window.f7Skills;
  if(!ctx) return;
  ctx.category = key;
  const cat = currentSkillCategory();
  ctx.item = cat?.items?.[0]?.key || null;
  renderSkillItems();
}
function selectSkillItem(key){ if(window.f7Skills){ window.f7Skills.item = key; renderSkillList(); } }
function renderSkillItems(){
  const ctx = window.f7Skills;
  const row = document.getElementById('skill-items');
  if(!ctx || !row) return;
  document.querySelectorAll('#skills-work-'+ctx.classId+' .chip-row:first-of-type button').forEach(btn => btn.classList.toggle('active', btn.textContent === currentSkillCategory()?.label));
  const cat = currentSkillCategory();
  row.innerHTML = (cat?.items || []).map(it => `<button class="${it.key===ctx.item?'active':''}" onclick="selectSkillItem('${esc(it.key)}')">${esc(it.label)}</button>`).join('');
  renderSkillList();
}
function renderSkillList(){
  const ctx = window.f7Skills, list = document.getElementById('skill-list');
  if(!ctx || !list) return;
  const cat = currentSkillCategory(), item = currentSkillItem();
  if(!cat || !item){ list.innerHTML = '<div class="empty-card"><p>No skill items configured.</p></div>'; return; }
  let rated = 0;
  ctx.learners.forEach(l => { if(ctx.entries[l.id]?.[cat.key]?.[item.key] != null) rated++; });
  list.innerHTML = `<div class="tally-row"><span>${rated} of ${ctx.learners.length} rated</span></div>
    ${ctx.learners.map((l,i) => {
      const current = ctx.entries[l.id]?.[cat.key]?.[item.key];
      return `<div class="report-card-preview">
        <div class="report-row" style="border-top:0;margin-top:0;padding-top:0;">
          <span><strong>${i+1}. ${esc(l.name || '')}</strong><br><small>${esc(l.admission_no || '-')}</small></span>
          <span class="skill-rating-buttons">${ctx.ratings.map(r => `<button class="${current===Number(r)?'active':''}" onclick="setSkillRating(${l.id},${Number(r)})">${esc(r)}</button>`).join('')}<button onclick="setSkillRating(${l.id},null)">-</button></span>
        </div>
      </div>`;
    }).join('') || '<div class="empty-card"><p>No learners in this class.</p></div>'}`;
}
function setSkillRating(learnerId, rating){
  const ctx = window.f7Skills, cat = currentSkillCategory(), item = currentSkillItem();
  if(!ctx || !cat || !item) return;
  if(!ctx.entries[learnerId]) ctx.entries[learnerId] = {};
  if(!ctx.entries[learnerId][cat.key]) ctx.entries[learnerId][cat.key] = {};
  if(rating == null) delete ctx.entries[learnerId][cat.key][item.key];
  else ctx.entries[learnerId][cat.key][item.key] = Number(rating);
  ctx.dirty = true;
  renderSkillList();
}
async function saveSkills(){
  const ctx = window.f7Skills;
  if(!ctx) return;
  const btn = document.getElementById('skill-save-btn');
  btn.disabled = true;
  const entries = [];
  ctx.learners.forEach(l => ctx.categories.forEach(cat => (cat.items || []).forEach(it => {
    const rating = ctx.entries[l.id]?.[cat.key]?.[it.key];
    entries.push({ learner_id:l.id, category_key:cat.key, item_key:it.key, rating:rating == null ? null : rating });
  })));
  try{ await api.post('/api/teacher/skills', { class_id:ctx.classId, assessment_type:ctx.assessment, term_id:ctx.termId || undefined, entries }); ctx.dirty = false; toast('Skills saved', 'success'); }
  catch(err){ toast(err.message || 'Skills save failed', 'error'); }
  finally{ btn.disabled = false; }
}

          <textarea class="comment-textarea" maxlength="1000" oninput="setCommentText(${l.id}, this.value)">${esc(window.f7Comments.entries[l.id])}</textarea>
        </div>
      `).join('') || '<div class="empty-card"><p>No learners in this class.</p></div>'}
      <div class="sticky-save"><button class="save-btn" id="comments-save-btn" onclick="saveComments()">Save Comments</button></div>
    `;
    recountComments();
  }catch(err){
    root.innerHTML = `<div class="empty-card"><i class="fas fa-triangle-exclamation"></i><p>${esc(err.message || 'Could not load comments')}</p></div>`;
  }
}
function setCommentText(learnerId, value){ if(window.f7Comments){ window.f7Comments.entries[learnerId] = String(value || ''); window.f7Comments.dirty = true; recountComments(); } }
function recountComments(){
  const ctx = window.f7Comments, box = document.getElementById('comments-stats');
  if(!ctx || !box) return;
  const filled = Object.values(ctx.entries).filter(v => String(v || '').trim()).length;
  box.innerHTML = `<span>${filled} of ${ctx.learners.length} commented</span>`;
}
async function saveComments(){
  const ctx = window.f7Comments;
  if(!ctx) return;
  const btn = document.getElementById('comments-save-btn');
  btn.disabled = true;
  const entries = ctx.learners.map(l => ({ learner_id:l.id, comment_text:String(ctx.entries[l.id] || '').trim() }));
  try{ await api.post('/api/teacher/comments', { class_id:ctx.classId, assessment_type:ctx.assessment, term_id:ctx.termId || undefined, entries }); ctx.dirty = false; toast('Comments saved', 'success'); }
  catch(err){ toast(err.message || 'Comments save failed', 'error'); }
  finally{ btn.disabled = false; }
}

async function loadAttendanceHome(date=todayLocal()){
  const root = document.getElementById('attendance-home-content');
  if(!root) return;
  root.innerHTML = `<div class="empty-card"><i class="fas fa-spinner fa-spin"></i><p>Loading attendance...</p></div>`;
  try{
    const data = await api.get(`/api/teacher/attendance/overview?date=${encodeURIComponent(date)}`);
    const totalClasses = Number(data.total_classes || 0);
    const marked = Number(data.marked_count || 0);
    const pct = totalClasses ? Math.round((marked / totalClasses) * 100) : 0;
    const classes = data.classes || [];
    const firstClassId = classes[0]?.id || null;
    root.innerHTML = `
      ${attendanceTopSwitch('landing', firstClassId)}
      <div class="att-today-card">
        <div class="att-tc-date">${esc(formatLongDate(data.date, true))}</div>
        <div class="att-tc-headline">${marked} of ${totalClasses} classes marked today</div>
        <div class="att-tc-progress"><div class="att-tc-progress-fill" style="width:${pct}%;"></div></div>
        <div class="att-tc-stats">
          <div class="att-tc-stat"><span class="att-dot" style="background:#7bed9f;"></span><b>${Number(data.present||0)}</b> present</div>
          <div class="att-tc-stat"><span class="att-dot" style="background:#ff6b6b;"></span><b>${Number(data.absent||0)}</b> absent</div>
          <div class="att-tc-stat"><span class="att-dot" style="background:#ffd166;"></span><b>${Number(data.late||0)}</b> late</div>
        </div>
      </div>
      <div class="att-sec-label"><i class="fas fa-chalkboard-user"></i> Your Classes</div>
      ${classes.length ? classes.map(c => attendanceClassCard(c)).join('') : `<div class="empty-card"><i class="fas fa-school"></i><p>No classes assigned.</p></div>`}
      <div class="att-sec-label"><i class="fas fa-chart-column"></i> Records</div>
      ${classes.length ? classes.map(c => `
        <button class="history-btn" onclick="navTab('#view-attendance','/attendance/${Number(c.id)}/history/')">
          <div class="hb-icon"><i class="fas fa-calendar-days"></i></div>
          <div class="hb-text"><div class="hb-title">${esc(c.name)} History & Summary</div><div class="hb-sub">Term attendance %, frequent absentees, day-by-day</div></div>
          <i class="fas fa-chevron-right hb-chev"></i>
        </button>`).join('') : ''}
      <div class="att-note">Tap a class to mark or review today's attendance.</div>`;
  }catch(err){
    root.innerHTML = `<div class="empty-card"><i class="fas fa-triangle-exclamation"></i><p>${esc(err.message || 'Could not load attendance')}</p></div>`;
  }
}

function attendanceClassCard(c){
  const marked = !!c.marked;
  const learnerCount = Number(c.learner_count || 0);
  const meta = marked
    ? `${learnerCount} learners - ${Number(c.present||0)} present, ${Number(c.absent||0)} absent, ${Number(c.late||0)} late`
    : `${learnerCount} learners - class teacher`;
  return `<div class="class-att-card ${marked ? 'marked' : 'pending'}" role="button" tabindex="0" onclick="navTab('#view-attendance','/attendance/${Number(c.id)}/')">
    <div class="cac-icon ${marked ? 'marked' : 'pending'}"><i class="fas fa-${marked ? 'clipboard-check' : 'clipboard-list'}"></i></div>
    <div class="cac-info">
      <div class="cac-name">${esc(c.name || 'Class')}</div>
      <div class="cac-meta">${esc(meta)}</div>
    </div>
    <div class="cac-status">
      <span class="cac-badge ${marked ? 'marked' : 'pending'}"><i class="fas fa-${marked ? 'check' : 'clock'}"></i> ${marked ? 'Marked' : 'Pending'}</span>
      ${marked && c.pct != null ? `<div class="cac-pct">${Number(c.pct)}<small>%</small></div>` : ''}
      <button class="att-mini-link" onclick="event.stopPropagation();navTab('#view-attendance','/attendance/${Number(c.id)}/history/')">History</button>
    </div>
  </div>`;
}

function attendanceTopSwitch(active, classId){
  const cid = Number(classId || 0);
  const markUrl = cid ? `/attendance/${cid}/` : '';
  const historyUrl = cid ? `/attendance/${cid}/history/` : '';
  return `<div class="att-screen-switch">
    <button class="${active==='landing'?'active':''}" onclick="attendanceGo('/attendance/')">1 &middot; Landing</button>
    <button class="${active==='mark'?'active':''}" ${cid?'':'disabled'} onclick="${cid ? `attendanceGo('${markUrl}')` : ''}">2 &middot; Mark</button>
    <button class="${active==='history'?'active':''}" ${cid?'':'disabled'} onclick="${cid ? `attendanceGo('${historyUrl}')` : ''}">3 &middot; History</button>

async function loadAttendanceHistory(classId){
  const root = document.getElementById(`attendance-history-${classId}`);
  if(!root) return;
  try{
    const [history, summary] = await Promise.all([
      api.get(`/api/teacher/attendance/history?class_id=${classId}&days=30`),
      api.get(`/api/teacher/attendance/summary?class_id=${classId}`)
    ]);
    const rows = summary.summary || [];
    const days = history.days || [];
    const present = rows.reduce((s,r)=>s+Number(r.present||0),0);
    const absent = rows.reduce((s,r)=>s+Number(r.absent||0),0);
    const late = rows.reduce((s,r)=>s+Number(r.late||0),0);
    const total = rows.reduce((s,r)=>s+Number(r.total||0),0);
    const pct = total ? Math.round((present / total) * 100) : 0;
    const flagged = rows.filter(r => Number(r.total||0) > 0 && Number(r.pct||0) < 85).slice(0, 8);
    root.innerHTML = `

      ${days.length ? days.map(attendanceDayRow).join('') : `<div class="empty-card"><i class="fas fa-calendar"></i><p>No attendance days recorded yet.</p></div>`}
      <div class="att-sec-label"><i class="fas fa-triangle-exclamation"></i> Frequent Absentees</div>

  }catch(err){

async function loadMarksEntry(classId, subjectId, item={}, assessment='opener'){
  const root = document.getElementById(`marks-work-${classId}-${subjectId}`);
  if(!root) return;
  root.innerHTML = `<div class="empty-card"><i class="fas fa-spinner fa-spin"></i><p>Loading marks...</p></div>`;
  try{
    const [componentsData, rosterData, marksData] = await Promise.all([
      api.get(`/api/teacher/assessment-components?class_id=${classId}&subject_id=${subjectId}&assessment_type=${assessment}`),
      api.get(`/api/teacher/classes/${classId}/learners`),
      api.get(`/api/teacher/marks?class_id=${classId}&subject_id=${subjectId}&assessment_type=${assessment}`)
    ]);
    const components = (componentsData.components || []).slice().sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
    const learners = rosterData.learners || [];
    const existing = marksData.entries || {};
    window.f7Marks = { classId, subjectId, assessment, item, components, learners, entries:{}, termId:marksData.term?.id || null, selected:components[0]?.component_key, dirty:false };
    learners.forEach(l=>{
      window.f7Marks.entries[l.id] = {};
      components.forEach(c=>{
        const row = existing[l.id] || existing[String(l.id)] || {};
        const has = Object.prototype.hasOwnProperty.call(row, c.component_key);
        const v = has ? row[c.component_key] : undefined;
        window.f7Marks.entries[l.id][c.component_key] = { score:v === null || v === undefined ? '' : String(v), notSat:has && v === null };
      });
    });
    root.innerHTML = `
      <div class="marks-assess-seg">${Object.entries(ASSESSMENT_LABELS).map(([k,label])=>`<button class="${assessment===k?'active':''}" onclick="loadMarksEntry('${classId}','${subjectId}',window.f7Marks?.item||{},'${k}')">${label}</button>`).join('')}</div>
      <div class="marks-comp-row" id="mk-comp-row"></div>
      <div class="marks-stat-card" id="mk-stats"></div>
      <div class="marks-search"><i class="fas fa-search"></i><input type="search" placeholder="Search learner..." oninput="filterF7Rows('mk-row-v2', this.value)"></div>
      <div id="mk-list"></div>
      <div class="sticky-save"><span class="marks-save-meta" id="mk-save-state">No unsaved changes</span><button class="save-btn" id="mk-save-btn" onclick="saveMarks()">Save Marks</button></div>`;
    renderMarkRows();
  }catch(err){
    if(/do not teach|class not found/i.test(err.message || '')){
      window.f7Marks = null;
      navTab('#view-marks', '/marks/');
      toast((state.subjectClasses || []).length ? 'Subject assignment updated' : 'No subjects assigned');
      return;
    }
    root.innerHTML = `<div class="empty-card"><i class="fas fa-triangle-exclamation"></i><p>${esc(err.message || 'Could not load marks')}</p></div>`;
  }
}
function currentMarkComponent(){ return (window.f7Marks?.components || []).find(c=>c.component_key === window.f7Marks.selected); }
function markCell(learnerId, key){ return window.f7Marks?.entries?.[learnerId]?.[key] || { score:'', notSat:false }; }
function markCellAccounted(cell){ return !!cell?.notSat || String(cell?.score ?? '').trim() !== ''; }
function selectedComponentComplete(component){
  const ctx = window.f7Marks;
  if(!ctx || !component || !ctx.learners.length) return false;
  return ctx.learners.every(l => markCellAccounted(markCell(l.id, component.component_key)));
}
function renderMarksComponentChips(){
  const ctx = window.f7Marks, row = document.getElementById('mk-comp-row');
  if(!ctx || !row) return;
  row.innerHTML = ctx.components.map(c=>`<button class="marks-comp-chip ${c.component_key===ctx.selected?'active':''}" onclick="selectMarkComponent('${esc(c.component_key)}')">${esc(c.component_name)} <small>/${esc(c.max_score)}</small>${selectedComponentComplete(c)?'<span class="marks-done-dot"></span>':''}</button>`).join('');
}
function selectMarkComponent(key){ if(!window.f7Marks) return; window.f7Marks.selected = key; renderMarkRows(); }
function learnerMarkSummary(learnerId){
  const ctx = window.f7Marks;
  let score = 0, max = 0, accounted = 0, numeric = 0, notSat = 0;
  (ctx?.components || []).forEach(c=>{
    const cell = markCell(learnerId, c.component_key);
    if(cell.notSat){ accounted++; notSat++; return; }
    const raw = String(cell.score ?? '').trim();
    if(raw === '') return;
    const n = Number(raw);
    if(Number.isFinite(n)){
      accounted++; numeric++;
      score += n;
      max += Number(c.max_score || 0);
    }
  });
  if(!numeric && notSat && accounted === (ctx?.components || []).length) return { state:'na', code:'N/A', pct:null, complete:true };
  if(!numeric) return { state:'none', code:'-', pct:null, complete:false };
  const pct = max ? Math.round((score / max) * 100) : null;
  const band = marksBandFromPercent(pct);
  const complete = accounted >= (ctx?.components || []).length;
  return { state:complete ? band.cls : 'partial', code:complete ? band.code : '...', pct, complete };
}
function renderMarkRows(){
  const ctx = window.f7Marks, list = document.getElementById('mk-list'), comp = currentMarkComponent();
  if(!ctx || !list || !comp){ if(list) list.innerHTML = '<div class="empty-card"><p>No assessment components configured.</p></div>'; renderMarksStats(); return; }
  const max = Number(comp.max_score || 0);
  list.innerHTML = ctx.learners.map((l,i)=>{
    const cell = markCell(l.id, comp.component_key);
    const summary = learnerMarkSummary(l.id);
    const rowClass = cell.notSat ? 'notsat na' : summary.state;
    return `<div class="mk-row-v2 ${rowClass}" data-learner-id="${l.id}" data-search="${esc(`${l.name||''} ${l.admission_no||''}`.toLowerCase())}">
      <div class="mk-idx">${i+1}</div>
      <div class="mk-who"><div class="mk-who-name">${esc(l.name||'Learner')}</div><div class="mk-who-adm">${esc(l.admission_no||'-')}</div></div>
      <div class="mk-input-wrap"><input class="mk-input" type="number" min="0" max="${max}" step="0.5" value="${esc(cell.score)}" ${cell.notSat?'disabled':''} oninput="setMarkScore(${Number(l.id)}, this.value, this)"><span class="mk-max">/${max}</span></div>
      <button class="mk-na-btn ${cell.notSat?'active':''}" title="Not sat" onclick="toggleNotSat(${Number(l.id)})">-</button>
      <div class="mk-grade"><div class="mk-grade-band ${summary.state}">${esc(summary.code)}</div><div class="mk-grade-pct">${summary.pct==null?'':`${summary.pct}%`}</div></div>
    </div>`;
  }).join('') || '<div class="empty-card"><p>No learners in this class.</p></div>';
  renderMarksStats();
}
function setMarksDirty(){
  if(window.f7Marks) window.f7Marks.dirty = true;
  const stateEl = document.getElementById('mk-save-state');
  if(stateEl){ stateEl.textContent = 'Unsaved changes'; stateEl.classList.add('dirty'); }
}
function setMarkScore(learnerId, raw, input){
  const ctx = window.f7Marks, comp = currentMarkComponent();
  if(!ctx || !comp) return;
  const max = Number(comp.max_score || 0), value = String(raw).trim(), n = Number(value);
  const invalid = value !== '' && (!Number.isFinite(n) || n < 0 || n > max);
  input.classList.toggle('invalid', invalid);
  if(!invalid){
    ctx.entries[learnerId][comp.component_key] = { score:value, notSat:false };
    setMarksDirty();
    renderMarksStats();
    const row = input.closest('.mk-row-v2');
    if(row){
      const summary = learnerMarkSummary(learnerId);
      row.className = `mk-row-v2 ${summary.state}`;
      row.querySelector('.mk-grade-band').className = `mk-grade-band ${summary.state}`;
      row.querySelector('.mk-grade-band').textContent = summary.code;
      row.querySelector('.mk-grade-pct').textContent = summary.pct==null ? '' : `${summary.pct}%`;
    }
  }
}
function toggleNotSat(learnerId){
  const ctx = window.f7Marks, comp = currentMarkComponent();
  if(!ctx || !comp) return;
  const cell = markCell(learnerId, comp.component_key);
  ctx.entries[learnerId][comp.component_key] = { score: cell.notSat ? '' : '', notSat: !cell.notSat };
  setMarksDirty();
  renderMarkRows();
}
function renderMarksStats(){
  const ctx = window.f7Marks, stats = document.getElementById('mk-stats');
  if(!ctx || !stats) return;
  renderMarksComponentChips();
  const summaries = ctx.learners.map(l=>learnerMarkSummary(l.id));
  const done = summaries.filter(s=>s.complete).length;
  const notSat = summaries.filter(s=>s.state === 'na').length;
  const pctRows = summaries.filter(s=>Number.isFinite(Number(s.pct)));
  const mean = pctRows.length ? Math.round(pctRows.reduce((sum,s)=>sum+Number(s.pct),0)/pctRows.length) : null;
  const counts = { ee:0, me:0, ae:0, be:0 };
  pctRows.forEach(s=>{ const b = marksBandFromPercent(s.pct).cls; if(counts[b] != null) counts[b]++; });
  const total = Math.max(1, pctRows.length);
  stats.innerHTML = `<div class="marks-stat-top">
      <div class="marks-stat"><div class="v accent">${done}/${ctx.learners.length}</div><div class="l">Done</div></div><div class="marks-stat-div"></div>
      <div class="marks-stat"><div class="v">${mean==null?'-':`${mean}%`}</div><div class="l">Class Mean</div></div><div class="marks-stat-div"></div>
      <div class="marks-stat"><div class="v">${notSat}</div><div class="l">Not Sat</div></div>
    </div>
    <div class="marks-dist-bar"><div class="ee" style="width:${counts.ee/total*100}%"></div><div class="me" style="width:${counts.me/total*100}%"></div><div class="ae" style="width:${counts.ae/total*100}%"></div><div class="be" style="width:${counts.be/total*100}%"></div></div>
    <div class="marks-dist-legend"><span><i style="background:#2fb344"></i>EE ${counts.ee}</span><span><i style="background:#4299e1"></i>ME ${counts.me}</span><span><i style="background:#f76707"></i>AE ${counts.ae}</span><span><i style="background:#d63939"></i>BE ${counts.be}</span></div>`;
}
async function saveMarks(){
  const ctx = window.f7Marks;
  if(!ctx) return;
  if(document.querySelector('.mk-input.invalid')) return toast('Fix out-of-range scores first', 'error');
  const btn = document.getElementById('mk-save-btn');
  if(btn) btn.disabled = true;
  const entries = [];
  ctx.learners.forEach(l=>ctx.components.forEach(c=>{
    const cell = markCell(l.id, c.component_key);
    entries.push({ learner_id:l.id, component_key:c.component_key, score:cell.notSat ? null : (String(cell.score||'').trim()==='' ? null : Number(cell.score)), not_sat:!!cell.notSat });
  }));
  try{
    await api.post('/api/teacher/marks', { class_id:ctx.classId, subject_id:ctx.subjectId, assessment_type:ctx.assessment, term_id:ctx.termId || undefined, entries });
    ctx.dirty = false;
    const stateEl = document.getElementById('mk-save-state');
    if(stateEl){ stateEl.textContent = 'Saved'; stateEl.classList.remove('dirty'); }
    toast('Marks saved', 'success');
  }
  catch(err){ toast(err.message || 'Marks save failed', 'error'); }
  finally{ if(btn) btn.disabled = false; }
}

async function bootMainApp(){
  hideLogin();
  // Pre-load dashboard + me data so first paint is instant
  try {
    const [me, dash] = await Promise.all([
      api.get('/api/auth/me').catch(()=>null),
      api.get('/api/teacher/dashboard').catch(()=>null)
    ]);
    state.me = me?.user || me;
    if(dash) setTeacherDashboardState(dash);
  } catch(_){}
  if(!app) initFramework7();
  startLiveSync();
  hideSplash();
}

async function bootApp(){
  showSplash();
  await loadSchoolBrand();

  // Check session
  try {
    const me = await api.get('/api/auth/me');
    if(!me?.authenticated) throw new Error('Not authenticated');
    state.me = me.user || me;
    await bootMainApp();
  } catch(_){
    // Not authenticated → show login
    hideSplash();
    showLogin();
  }
}

// Service worker registration
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/app/sw.js').catch(()=>{});
}

// Start
window.addEventListener('DOMContentLoaded', bootApp);
</script>
