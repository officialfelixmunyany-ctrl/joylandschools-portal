// â•â•â•â•â•â•â•â•â•â•â• ROUTER (single-page screens within /app) â•â•â•â•â•â•â•â•â•â•â•
let currentScreen = 'dashboard';
let screenParams = {};

function goto(screen, params={}){
  confirmLeaveDirtyScreen(screen, params).then(ok => { if(ok) completeGoto(screen, params); });
}

function completeGoto(screen, params={}){
  currentScreen = screen;
  screenParams = params;
  const hash = '#' + screen + (Object.keys(params).length ? '?' + new URLSearchParams(Object.fromEntries(Object.entries(params).map(([k,v]) => [k, String(v)]))).toString() : '');
  if(history.state?.screen !== screen || JSON.stringify(history.state?.params||{}) !== JSON.stringify(params)){
    history.pushState({ screen, params }, '', hash);
  }
  window.scrollTo({ top:0, behavior:'auto' });
  renderCurrentScreen();
}

// Prompt the teacher if they have unsaved attendance changes and are navigating away
// from the marking screen (or to a different date/class within the same screen).
function appConfirm(message, title='Confirm'){
  return new Promise(resolve => app.dialog.confirm(message, title, () => resolve(true), () => resolve(false)));
}

async function confirmLeaveDirtyScreen(nextScreen, nextParams={}){
  // --- ATTENDANCE marking dirty check ---
  if(window._attDirty && currentScreen === 'attendance' && !screenParams.view){
    const sameClassAndDate = nextScreen === 'attendance'
      && !nextParams.view
      && String(nextParams.class_id) === String(screenParams.class_id)
      && String(nextParams.date || '') === String(screenParams.date || '');
    if(!sameClassAndDate){
      if(!await appConfirm('You have unsaved attendance changes. Discard them?', 'Unsaved changes')) return false;
      window._attDirty = false;
    }
  }
  // --- MARKS entry dirty check ---
  if(window._mkDirty && currentScreen === 'marks' && screenParams.class_id && screenParams.subject_id){
    const sameSubject = nextScreen === 'marks'
      && String(nextParams.class_id) === String(screenParams.class_id)
      && String(nextParams.subject_id) === String(screenParams.subject_id)
      && String(nextParams.assessment_type || '') === String(screenParams.assessment_type || '');
    if(!sameSubject){
      if(!await appConfirm('You have unsaved marks. Discard them?', 'Unsaved changes')) return false;
      window._mkDirty = false;
    }
  }
  // --- SKILLS entry dirty check ---
  if(window._skDirty && currentScreen === 'skills' && screenParams.class_id){
    const sameClass = nextScreen === 'skills'
      && String(nextParams.class_id) === String(screenParams.class_id)
      && String(nextParams.assessment_type || '') === String(screenParams.assessment_type || '');
    if(!sameClass){
      if(!await appConfirm('You have unsaved skill ratings. Discard them?', 'Unsaved changes')) return false;
      window._skDirty = false;
    }
  }
  // --- COMMENTS entry dirty check ---
  if(window._cmDirty && currentScreen === 'comments' && screenParams.class_id){
    const sameClass = nextScreen === 'comments'
      && String(nextParams.class_id) === String(screenParams.class_id)
      && String(nextParams.assessment_type || '') === String(screenParams.assessment_type || '');
    if(!sameClass){
      if(!await appConfirm('You have unsaved comments. Discard them?', 'Unsaved changes')) return false;
      window._cmDirty = false;
    }
  }
  return true;
}

function hydrateRouteFromHash(){
  const raw = (location.hash || '').replace(/^#/, '');
  if(!raw) return;
  const [screen, query=''] = raw.split('?');
  currentScreen = screen || 'dashboard';
  screenParams = Object.fromEntries(new URLSearchParams(query).entries());
  if(screenParams.class_id) screenParams.class_id = Number(screenParams.class_id);
  if(screenParams.learner_id) screenParams.learner_id = Number(screenParams.learner_id);
  history.replaceState({ screen:currentScreen, params:screenParams }, '', location.hash);
}

function back(){
  // Same unsaved-attendance check as goto(): leaving the Mark view loses work
  confirmLeaveDirtyScreen('dashboard', {}).then(ok => {
    if(!ok) return;
    if(history.length > 1 && currentScreen !== 'dashboard') return history.back();
    goto('dashboard');
  });
}

window.addEventListener('popstate', e => {
  const state = e.state || { screen:'dashboard', params:{} };
  currentScreen = state.screen || 'dashboard';
  screenParams = state.params || {};
  renderCurrentScreen();
});

function renderCurrentScreen(){
  if(!me) return; // can't render screens without an authed user
  updateBottomTab(currentScreen);
  if(currentScreen === 'notifications') return renderNotificationsScreen();
  if(me.role === 'learner'){
    switch(currentScreen){
      case 'dashboard':         return renderLearnerDashboard();
      case 'learnerMarks':      return renderLearnerMarks(screenParams);
      case 'learnerAttendance': return renderLearnerAttendance(screenParams);
      case 'learnerSkills':     return renderLearnerSkills(screenParams);
      case 'learnerComments':   return renderLearnerComments(screenParams);
      case 'learnerProfile':    return renderLearnerProfile(screenParams);
      default:                  return renderLearnerDashboard();
    }
  }
  if(me.role === 'parent'){
    switch(currentScreen){
      case 'dashboard':        return renderParentDashboard();
      case 'parentChild':      return renderParentChild(screenParams);
      case 'parentMarks':      return renderParentMarks(screenParams);
      case 'parentAttendance': return renderParentAttendance(screenParams);
      case 'parentSkills':     return renderParentSkills(screenParams);
      case 'parentComments':   return renderParentComments(screenParams);
      case 'parentProfile':    return renderParentProfile(screenParams);
      default:                 return renderParentDashboard();
    }
  }
  switch(currentScreen){
    case 'dashboard':  return renderTeacherDashboard();
    case 'attendance': return renderAttendanceScreen(screenParams);
    case 'marks':      return renderMarksScreen(screenParams);
    case 'skills':     return renderSkillsScreen(screenParams);
    case 'comments':   return renderCommentsScreen(screenParams);
    case 'reports':    return renderReportsScreen(screenParams);
    case 'profile':    return renderProfileScreen(screenParams);
    case 'more':       return renderMoreScreen();
    default:           return renderTeacherDashboard();
  }
}

async function renderAttendanceScreen(params={}){
  const root = document.getElementById('dashboard-root');
  // Step 1: pick a class
  if(!params.class_id){
    root.innerHTML = screenHeader('Fill Attendance', 'Pick a class')
      + `<div class="content"><div class="empty"><i class="fas fa-spinner fa-spin"></i><p>Loadingâ€¦</p></div></div>`;
    const r = await api('GET','/api/teacher/dashboard');
    if(!r.success){

        + `<div class="content"><div class="empty"><i class="fas fa-exclamation-triangle"></i><p>${esc(r.message||'Could not load')}</p></div></div>`;
      return;
    }
    const classes = r.data.my_classes || [];
    const todayAtt = r.data.today_attendance || {};
    const list = classes.length
      ? classes.map(c => `<button class="class-card-btn" onclick="goto('attendance',${JSON.stringify({class_id:c.id,class_name:c.name}).replace(/"/g,'&quot;')})">

          <i class="fas fa-chevron-right chev"></i>
        </button>`).join('')
      : `<div class="empty"><i class="fas fa-school"></i><p>You're not a class teacher for any class.<br>Ask admin to assign you in Academics â†’ Classes.</p></div>`;

      + `<div class="content">
          <div class="screen-section-title">Your Classes</div>
          <div class="class-list">${list}</div>
        </div>`;

  }
  if(params.view === 'history') return renderAttendanceHistory(params);
  if(params.view === 'summary') return renderAttendanceSummary(params);
  await renderAttendanceMarking(params);
}

async function renderAttendanceMarking({ class_id, class_name, date }){
  const today = todayLocal();
  const useDate = date || today;
  const prevDate = shiftIsoDate(useDate, -1);
  const root = document.getElementById('dashboard-root');
  root.innerHTML = screenHeader('Attendance', class_name || 'Class')
    + `<div class="content">
        ${attTabs('mark', { class_id, class_name, date:useDate })}
        <div class="date-picker-row">
          <button class="date-icon-btn" onclick="att_shift(-1)" aria-label="Previous day"><i class="fas fa-chevron-left"></i></button>
          <input type="date" id="att-date" value="${useDate}" max="${today}" onchange="att_jump(this.value)">
          <button class="date-icon-btn" onclick="att_shift(1)" aria-label="Next day" ${useDate>=today?'disabled style="opacity:.35;cursor:not-allowed;"':''}><i class="fas fa-chevron-right"></i></button>
          ${useDate !== today ? `<button class="date-today-pill" onclick="att_jump('${today}')">Today</button>` : ''}
          <button class="date-icon-btn" onclick="att_openCalendar()" aria-label="Calendar"><i class="fas fa-calendar-days"></i></button>
        </div>
        <div id="att-list"><div class="empty"><i class="fas fa-spinner fa-spin"></i><p>Loading learnersâ€¦</p></div></div>
      </div>`;

  window._attCtx = { class_id, class_name, date: useDate };
  window._attDirty = false; // fresh load â€” no unsaved edits yet

  const [rosterResp, existingResp, yesterdayResp, historyResp] = await Promise.all([
    api('GET', `/api/teacher/classes/${class_id}/learners`),
    api('GET', `/api/teacher/attendance?class_id=${class_id}&date=${useDate}`),
    api('GET', `/api/teacher/attendance?class_id=${class_id}&date=${prevDate}`),
    api('GET', `/api/teacher/attendance/history?class_id=${class_id}&days=90`)
  ]);
  if(!rosterResp.success){
    document.getElementById('att-list').innerHTML = `<div class="empty"><i class="fas fa-exclamation-triangle"></i><p>${esc(rosterResp.message||'Could not load class roster')}</p></div>`;
    return;
  }
  const learners = rosterResp.data?.learners || [];
  const existing = (existingResp.success && existingResp.data?.entries) || {};
  window._attYesterday = (yesterdayResp.success && yesterdayResp.data?.entries) || {};
  window._attRoster = learners;
  window._attMarkedDates = new Set(historyResp.success ? (historyResp.data?.days || []).map(d => d.date) : []);
  if(Object.keys(existing).length) window._attMarkedDates.add(useDate);
  if(!learners.length){
    document.getElementById('att-list').innerHTML = `<div class="empty"><i class="fas fa-users"></i><p>No active learners in this class yet.</p></div>`;
    return;
  }
  const isUnmarked = !Object.keys(existing).length;
  const unmarkedBanner = isUnmarked
    ? `<div class="att-unmarked-banner"><i class="fas fa-info-circle"></i><span>No attendance saved for <strong>${esc(useDate)}</strong> yet â€” you're starting fresh. All learners default to <strong>Present</strong>.</span></div>`
    : '';
  document.getElementById('att-list').innerHTML = `
    ${unmarkedBanner}
    <div class="att-search-wrap">
      <i class="fas fa-search"></i>
      <input type="text" id="att-search" placeholder="Search learner..." oninput="att_filter(this.value)">
    </div>
    <div class="att-quick-row">
      <button class="qa-btn qa-all-p" onclick="att_markAll('P')"><i class="fas fa-check"></i> All Present</button>
      <button class="qa-btn qa-all-a" onclick="att_markAll('A')"><i class="fas fa-times"></i> All Absent</button>

function att_set(learnerId, status, opts={}){
  const row = document.querySelector(`.att-row[data-learner-id="${learnerId}"]`);
  if(!row) return;
  row.querySelectorAll('.ab').forEach(b => b.classList.remove('active'));
  row.querySelector(`.ab-${status.toLowerCase()}`).classList.add('active');
  row.dataset.status = status;
  row.classList.remove('status-p','status-a','status-l','swipe-right','swipe-left');
  row.classList.add(`status-${status.toLowerCase()}`);
  const extra = row.querySelector('.att-extra');
  if(extra){
    extra.style.display = status === 'L' ? 'flex' : 'none';
    // Pre-fill late time with current HH:MM if empty (90% of cases the right answer is "now")
    if(status === 'L'){
      const timeEl = row.querySelector('[data-late-time]');
      if(timeEl && !timeEl.value){
        const now = new Date();
        timeEl.value = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      }
    }
  }
  if(!opts.quiet && navigator.vibrate) navigator.vibrate(20);
  window._attDirty = true; // teacher has unsaved local changes
  att_recountTally();
}
function att_markAll(status){
  document.querySelectorAll('.att-row').forEach(row => {
    const id = row.dataset.learnerId;
    if(id) att_set(id, status, { quiet:true });
  });
  if(navigator.vibrate) navigator.vibrate(45);
}
function att_carryYesterday(){
  const entries = window._attYesterday || {};
  const ids = Object.keys(entries);
  if(!ids.length){ toast('No attendance found for yesterday',''); return; }
  ids.forEach(id => {
    const e = entries[id] || {};
    att_set(id, e.status || 'P', { quiet:true });
    const row = document.querySelector(`.att-row[data-learner-id="${id}"]`);
    if(!row) return;
    const note = String(e.note || '');
    if(note.includes('|')){
      const [time, ...rest] = note.split('|');
      const timeEl = row.querySelector('[data-late-time]');
      const noteEl = row.querySelector('[data-late-note]');
      if(timeEl) timeEl.value = time.trim();
      if(noteEl) noteEl.value = rest.join('|').trim();
    }
  });
  toast(`Copied ${ids.length} from yesterday`, 'success');
  if(navigator.vibrate) navigator.vibrate(60);
}
function att_recountTally(){
  let p=0,a=0,l=0,visible=0,total=0;
  document.querySelectorAll('.att-row').forEach(row => {
    total++;
    if(!row.classList.contains('hidden')) visible++;
    if(row.dataset.status === 'P') p++;
    else if(row.dataset.status === 'A') a++;
    else if(row.dataset.status === 'L') l++;
  });
  const setPill = (id, n, label) => { const el = document.getElementById(id); if(el) el.innerHTML = `<i class="fas fa-${label==='P'?'check-circle':label==='A'?'times-circle':'clock'}"></i> ${n} ${label}`; };
  setPill('tally-p', p, 'P'); setPill('tally-a', a, 'A'); setPill('tally-l', l, 'L');
  setText('att-visible-count', visible === total ? `${total} learners` : `Showing ${visible} of ${total} learners`);
}
function att_filter(q){
  const term = String(q || '').trim().toLowerCase();
  document.querySelectorAll('.att-row').forEach(row => {
    const hay = `${row.dataset.name || ''} ${row.dataset.adm || ''}`;
    row.classList.toggle('hidden', !!term && !hay.includes(term));
  });
  att_recountTally();
}
function att_shift(delta){
  const ctx = window._attCtx; if(!ctx) return;
  const today = todayLocal();
  const newDate = shiftIsoDate(ctx.date, delta);
  if(newDate > today) return;
  goto('attendance', { class_id: ctx.class_id, class_name: ctx.class_name, date: newDate });
}
function att_jump(date){
  const ctx = window._attCtx; if(!ctx) return;
  goto('attendance', { class_id: ctx.class_id, class_name: ctx.class_name, date });
}
async function att_save(){
  const ctx = window._attCtx; if(!ctx) return;
  const btn = document.getElementById('att-save-btn');
  btn.disabled = true;
  const original = btn.innerHTML;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Savingâ€¦';
  const entries = Array.from(document.querySelectorAll('.att-row')).map(row => {
    const id = Number(row.dataset.learnerId);
    const status = row.dataset.status || 'P';
    let note = '';
    if(status === 'L'){
      const t = row.querySelector('[data-late-time]')?.value?.trim() || '';
      const n = row.querySelector('[data-late-note]')?.value?.trim() || '';
      note = t && n ? `${t} | ${n}` : (t || n);
    }
    return {
      learner_id:id,
      name:row.querySelector('.att-name')?.textContent?.trim() || '',
      admission_no:row.querySelector('.att-adm')?.textContent?.trim() || '',
      status,
      note
    };
  });
  const r = await api('POST','/api/teacher/attendance', { class_id: ctx.class_id, date: ctx.date, entries:entries.map(({learner_id,status,note}) => ({ learner_id,status,note })) });
  btn.disabled = false;
  btn.innerHTML = original;
  if(r.success){
    window._attDirty = false; // saved â€” clean state
    if(navigator.vibrate) navigator.vibrate([70,40,90]);
    window._attMarkedDates?.add(ctx.date);
    renderAttendanceDone(ctx, entries, r.message || 'Attendance saved');
  } else {
    toast(r.message || 'Save failed','error');
  }
}

async function att_copyAbsentLate(){
  const saved = window._attLastSaved;
  if(!saved) return;
  const absent = saved.entries.filter(e => e.status === 'A');
  const late = saved.entries.filter(e => e.status === 'L');
  const lines = [`${saved.ctx.class_name || 'Class'} - Attendance - ${saved.ctx.date}`, ''];
  if(absent.length){
    lines.push('ABSENT:');
    absent.forEach(e => lines.push(`- ${e.name} (${e.admission_no})`));
  }
  if(late.length){
    if(absent.length) lines.push('');
    lines.push('LATE:');
    late.forEach(e => lines.push(`- ${e.name}${e.note ? ` - ${e.note}` : ''}`));
  }
  const text = lines.join('\n');
  try{
    await navigator.clipboard.writeText(text);
    toast('Copied to clipboard', 'success');
  }catch(e){
    toast(text, '');
  }
}

function att_bindGestures(){
  const list = document.getElementById('att-list');
  if(!list || list.dataset.swipeBound) return;
  list.dataset.swipeBound = '1';
  let start = null;
  list.addEventListener('pointerdown', e => {
    const row = e.target.closest('.att-row');
    if(!row || e.target.closest('button,input')) return;
    start = { id:row.dataset.learnerId, x:e.clientX, y:e.clientY };
  });
  list.addEventListener('pointerup', e => {
    if(!start) return;
    const dx = e.clientX - start.x;
    const dy = e.clientY - start.y;
    const id = start.id;
    start = null;
    if(Math.abs(dx) < 62 || Math.abs(dx) < Math.abs(dy) * 1.45) return;
    const status = dx > 0 ? 'P' : 'A';
    att_set(id, status, { quiet:true });
    const row = document.querySelector(`.att-row[data-learner-id="${id}"]`);
    if(row){
      row.classList.add(dx > 0 ? 'swipe-right' : 'swipe-left');
      setTimeout(() => row.classList.remove('swipe-right','swipe-left'), 180);
    }
    if(navigator.vibrate) navigator.vibrate(30);
  });
}

async function att_toggleHistoryDay(date){

  body.classList.toggle('open', willOpen);
  if(!willOpen || body.dataset.loaded) return;
  const ctx = window._attHistoryCtx;
  const [rosterResp, attResp] = await Promise.all([
    api('GET', `/api/teacher/classes/${ctx.class_id}/learners`),
    api('GET', `/api/teacher/attendance?class_id=${ctx.class_id}&date=${date}`)
  ]);
  const roster = rosterResp.success ? (rosterResp.data?.learners || []) : [];
  const entries = attResp.success ? (attResp.data?.entries || {}) : {};
  body.dataset.loaded = '1';
  body.innerHTML = roster.map(l => {

    return `<div class="att-history-person">
      <div>

function att_sortSummary(key, btn){
  document.querySelectorAll('.summary-sort button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const list = document.getElementById('summary-list');
  const cards = Array.from(list.querySelectorAll('.att-summary-card'));
  cards.sort((a,b) => {
    if(key === 'name') return a.dataset.name.localeCompare(b.dataset.name);
    if(key === 'absent') return Number(b.dataset.absent) - Number(a.dataset.absent);
    return Number(a.dataset.pct) - Number(b.dataset.pct);
  });
  cards.forEach(card => list.appendChild(card));
}

function att_openCalendar(){
  if(!window._attCtx) return;
  document.body.classList.add('cal-open'); // lock page scroll while overlay is up
  let overlay = document.getElementById('att-cal-overlay');
  if(!overlay){
    document.body.insertAdjacentHTML('beforeend', `<div class="att-cal-overlay" id="att-cal-overlay" onclick="att_closeCalendarOutside(event)">
      <div class="att-cal">
        <div class="att-cal-head">
          <button class="att-cal-btn" onclick="att_calNav(-1)"><i class="fas fa-chevron-left"></i></button>
          <div class="att-cal-title" id="att-cal-title">Calendar</div>
          <button class="att-cal-btn" onclick="att_calNav(1)"><i class="fas fa-chevron-right"></i></button>
          <button class="att-cal-close" onclick="att_closeCalendar()"><i class="fas fa-times"></i></button>
        </div>
        <div class="att-cal-week"><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span></div>
        <div class="att-cal-grid" id="att-cal-grid"></div>
      </div>
    </div>`);
    overlay = document.getElementById('att-cal-overlay');
  }
  const d = dateFromIso(window._attCtx.date);
  window._attCal = { year:d.getFullYear(), month:d.getMonth() };
  att_renderCalendar();
  overlay.classList.add('open');
}
function att_closeCalendar(){
  document.body.classList.remove('cal-open');
  document.getElementById('att-cal-overlay')?.classList.remove('open');
}
function att_closeCalendarOutside(e){ if(e.target?.id === 'att-cal-overlay') att_closeCalendar(); }
function att_calNav(delta){
  if(!window._attCal) return;
  window._attCal.month += delta;
  if(window._attCal.month < 0){ window._attCal.month = 11; window._attCal.year--; }
  if(window._attCal.month > 11){ window._attCal.month = 0; window._attCal.year++; }
  att_renderCalendar();
}
function att_renderCalendar(){
  const cal = window._attCal;
  if(!cal) return;
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  setText('att-cal-title', `${months[cal.month]} ${cal.year}`);
  const grid = document.getElementById('att-cal-grid');
  const first = new Date(cal.year, cal.month, 1);
  const last = new Date(cal.year, cal.month + 1, 0);
  const offset = (first.getDay() + 6) % 7;
  const today = todayLocal();
  const selected = window._attCtx?.date;
  const marked = window._attMarkedDates || new Set();
  let html = '';
  for(let i=0;i<offset;i++) html += `<button class="att-cal-day empty"></button>`;
  for(let day=1; day<=last.getDate(); day++){
    const iso = isoFromParts(cal.year, cal.month + 1, day);
    const cls = ['att-cal-day'];
    if(iso > today) cls.push('future');
    if(iso === today || iso === selected) cls.push('today');
    if(marked.has(iso)) cls.push('marked');
    html += `<button class="${cls.join(' ')}" onclick="att_pickCalendarDate('${iso}')">${day}</button>`;
  }
  grid.innerHTML = html;
}
function att_pickCalendarDate(iso){
  const ctx = window._attCtx;
  att_closeCalendar();
  goto('attendance', { class_id:ctx.class_id, class_name:ctx.class_name, date:iso });

function attStatusLabel(status){
  if(status === 'P') return 'Present';
  if(status === 'L') return 'Late';
  return 'Absent';
}
function dateFromIso(iso){
  const [y,m,d] = String(iso).split('-').map(Number);
  return new Date(y, (m || 1) - 1, d || 1);
}
function isoFromParts(y,m,d){
  return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function shiftIsoDate(iso, days){
  const d = dateFromIso(iso);
  d.setDate(d.getDate() + days);
  return isoFromParts(d.getFullYear(), d.getMonth() + 1, d.getDate());
}
function todayLocal(){
  const d = new Date();
  return isoFromParts(d.getFullYear(), d.getMonth() + 1, d.getDate());
}

async function renderMarksEntry(params){
  const { class_id, class_name, subject_id, subject_name, subject_code } = params;
  const assessment = params.assessment_type || 'midterm';
  const subLine = `${esc(class_name||'')} Â· ${esc(ASSESSMENT_LABELS[assessment] || assessment)}`;
  const root = document.getElementById('dashboard-root');
  root.innerHTML = screenHeader(subject_name || 'Marks', '')
    + `<div class="content">
        <div class="mk-context">
          <div class="mk-context-name">${esc(class_name||'')}${subject_code?` Â· ${esc(subject_code)}`:''}</div>
          <div class="mk-assess-tabs">
            <button class="mk-assess-btn ${assessment==='midterm'?'active':''}" onclick="mk_switchAssessment('midterm')">Midterm</button>
            <button class="mk-assess-btn ${assessment==='endterm'?'active':''}" onclick="mk_switchAssessment('endterm')">Endterm</button>
          </div>
        </div>
        <div id="mk-component-area"><div class="empty"><i class="fas fa-spinner fa-spin"></i><p>Loading componentsâ€¦</p></div></div>
        <div id="mk-list"></div>
      </div>`;

  window._mkCtx = { class_id, class_name, subject_id, subject_name, subject_code, assessment_type:assessment };
  window._mkDirty = false;
  window._mkEntries = {}; // { learnerId: { componentKey: scoreOrEmpty } }
  window._mkSelectedComponent = null;

  // Fetch components + roster + existing marks in parallel
  const [compsResp, rosterResp, marksResp] = await Promise.all([
    api('GET', `/api/teacher/assessment-components?class_id=${class_id}&subject_id=${subject_id}&assessment_type=${assessment}`),
    api('GET', `/api/teacher/classes/${class_id}/learners`),
    api('GET', `/api/teacher/marks?class_id=${class_id}&subject_id=${subject_id}&assessment_type=${assessment}`)
  ]);

  if(!compsResp.success){
    document.getElementById('mk-component-area').innerHTML = `<div class="empty"><i class="fas fa-exclamation-triangle"></i><p>${esc(compsResp.message||'Could not load components')}</p></div>`;
    return;
  }
  const components = (compsResp.data?.components || []).slice().sort((a,b) => (a.sort_order||0)-(b.sort_order||0));
  if(!components.length){
    document.getElementById('mk-component-area').innerHTML = `
      <div class="empty">
        <i class="fas fa-sliders-h"></i>
        <p>No components configured for <strong>${esc(subject_name||'')}</strong> at <strong>${esc(ASSESSMENT_LABELS[assessment]||assessment)}</strong>.</p>
        <p style="font-size:11px;margin-top:8px;">Ask admin to set them up in <strong>Admin â†’ Assessments</strong>.</p>
      </div>`;
    return;
  }
  window._mkComponents = components;
  window._mkSelectedComponent = components[0].component_key;
  const roster = rosterResp.success ? (rosterResp.data?.learners || []) : [];
  const entriesByLearner = marksResp.success ? (marksResp.data?.entries || {}) : {};
  window._mkRoster = roster;
  // Seed entries (so unchanged values still get sent on save â†’ idempotent)
  roster.forEach(l => {
    window._mkEntries[l.id] = {};
    components.forEach(c => {
      const existing = entriesByLearner[l.id]?.[c.component_key] ?? entriesByLearner[String(l.id)]?.[c.component_key];
      window._mkEntries[l.id][c.component_key] = (existing === null || existing === undefined) ? '' : String(existing);
    });
  });
  window._mkTermId = marksResp.success ? marksResp.data?.term?.id : null;

  document.getElementById('mk-component-area').innerHTML = `
    <div class="mk-comp-row">
      ${components.map(c => `
        <button class="mk-comp-chip ${c.component_key===window._mkSelectedComponent?'active':''}" onclick="mk_selectComponent('${esc(c.component_key)}')">
          <span class="mk-comp-name">${esc(c.component_name)}</span>
          <span class="mk-comp-max">/${esc(String(c.max_score))}</span>
        </button>`).join('')}
    </div>
    <div class="mk-stats" id="mk-stats"></div>`;

  mk_renderList();
}

function mk_selectComponent(key){
  if(window._mkSelectedComponent === key) return;
  window._mkSelectedComponent = key;
  document.querySelectorAll('.mk-comp-chip').forEach(b => b.classList.remove('active'));
  document.querySelector(`.mk-comp-chip[onclick*="${key}"]`)?.classList.add('active');
  mk_renderList();
}

function mk_currentComponent(){
  return (window._mkComponents || []).find(c => c.component_key === window._mkSelectedComponent);
}

function mk_renderList(){
  const list = document.getElementById('mk-list');
  const roster = window._mkRoster || [];
  const comp = mk_currentComponent();
  if(!comp){ list.innerHTML = ''; return; }
  if(!roster.length){
    list.innerHTML = `<div class="empty"><i class="fas fa-users"></i><p>No active learners in this class.</p></div>`;
    return;
  }
  const max = Number(comp.max_score);
  list.innerHTML = `
    <div class="mk-search-wrap">
      <i class="fas fa-search"></i>
      <input type="text" placeholder="Search learner..." oninput="mk_filter(this.value)">
    </div>
    <div class="mk-quick-row">
      <button class="qa-btn qa-mark-absent" onclick="mk_markRemainingZero()"><i class="fas fa-times"></i> Fill empty with 0</button>
      <button class="qa-btn qa-clear" onclick="mk_clearAll()"><i class="fas fa-eraser"></i> Clear ${esc(comp.component_name)}</button>
    </div>
    ${roster.map((l, i) => {
      const val = window._mkEntries[l.id]?.[comp.component_key] ?? '';
      return `<div class="mk-row" data-learner-id="${l.id}" data-name="${esc((l.name||'').toLowerCase())}" data-adm="${esc((l.admission_no||'').toLowerCase())}">
        <div class="mk-info">
          <span class="mk-num">${i+1}</span>
          <div class="mk-name-block">
            <div class="mk-name">${esc(l.name||'')}</div>
            <div class="mk-adm">${esc(l.admission_no||'â€”')}</div>
          </div>
        </div>
        <div class="mk-score-wrap">
          <input type="number" inputmode="decimal" min="0" max="${esc(String(max))}" step="0.5"
            value="${esc(val)}" placeholder="â€”"
            onfocus="this.select()"
            oninput="mk_setScore(${l.id}, this.value, this)"
            class="mk-score-input">
          <span class="mk-score-max">/${esc(String(max))}</span>
        </div>
      </div>`;
    }).join('')}
    <div class="mk-save-bar">
      <button class="login-btn" onclick="mk_save()" id="mk-save-btn"><i class="fas fa-save"></i> Save ${esc(comp.component_name)}</button>
    </div>`;
  mk_recountStats();
}

function mk_setScore(learnerId, raw, inputEl){
  const comp = mk_currentComponent(); if(!comp) return;
  const max = Number(comp.max_score);
  let value = String(raw).trim();
  if(value === ''){
    window._mkEntries[learnerId][comp.component_key] = '';
    inputEl.classList.remove('mk-score-invalid','mk-score-touched');
    window._mkDirty = true;
    mk_recountStats();
    return;
  }
  const num = Number(value);
  const invalid = !Number.isFinite(num) || num < 0 || num > max;
  if(invalid){
    inputEl.classList.add('mk-score-invalid');
  } else {
    inputEl.classList.remove('mk-score-invalid');
    inputEl.classList.add('mk-score-touched');
    window._mkEntries[learnerId][comp.component_key] = value;
  }
  window._mkDirty = true;
  mk_recountStats();
}

function mk_recountStats(){
  const comp = mk_currentComponent();
  const box = document.getElementById('mk-stats');
  if(!comp || !box) return;
  const scores = [];
  const roster = window._mkRoster || [];
  roster.forEach(l => {
    const v = window._mkEntries[l.id]?.[comp.component_key];
    const n = Number(v);
    if(v !== '' && v != null && Number.isFinite(n)) scores.push(n);
  });
  if(!scores.length){
    box.innerHTML = `<span class="mk-stat-pill">0 of ${roster.length} entered</span>`;
    return;
  }
  const total = scores.reduce((a,b)=>a+b,0);
  const avg = (total/scores.length).toFixed(1);
  const hi  = Math.max(...scores);
  const lo  = Math.min(...scores);
  box.innerHTML = `
    <span class="mk-stat-pill">${scores.length} of ${roster.length}</span>
    <span class="mk-stat-pill"><i class="fas fa-chart-line"></i> Avg ${avg}</span>
    <span class="mk-stat-pill"><i class="fas fa-arrow-up"></i> Hi ${hi}</span>
    <span class="mk-stat-pill"><i class="fas fa-arrow-down"></i> Lo ${lo}</span>`;
}

function mk_filter(q){
  const term = String(q || '').trim().toLowerCase();
  document.querySelectorAll('.mk-row').forEach(row => {
    const hay = `${row.dataset.name || ''} ${row.dataset.adm || ''}`;
    row.classList.toggle('hidden', !!term && !hay.includes(term));
  });
}

function mk_markRemainingZero(){
  const comp = mk_currentComponent(); if(!comp) return;
  app.dialog.confirm(`Fill all empty ${comp.component_name} scores with 0?`, 'Fill empty marks', () => {
    let changed = 0;
    (window._mkRoster || []).forEach(l => {
      const cur = window._mkEntries[l.id]?.[comp.component_key];
      if(cur === '' || cur == null){
        window._mkEntries[l.id][comp.component_key] = '0';
        changed++;
      }
    });
    if(changed){
      window._mkDirty = true;
      mk_renderList(); // re-render to reflect new values in inputs
      toast(`Filled ${changed} empty score${changed===1?'':'s'} with 0`, 'success');
    } else {
      toast('All scores already entered','');
    }
  });
}

function mk_clearAll(){
  const comp = mk_currentComponent(); if(!comp) return;
  app.dialog.confirm(`Clear all entered ${comp.component_name} scores?`, 'Clear marks', () => {
    (window._mkRoster || []).forEach(l => {
      if(window._mkEntries[l.id]) window._mkEntries[l.id][comp.component_key] = '';
    });
    window._mkDirty = true;
    mk_renderList();
    toast(`Cleared ${comp.component_name} scores`, '');
  });
}

async function mk_save(){
  const ctx = window._mkCtx;
  const comp = mk_currentComponent();
  if(!ctx || !comp) return;
  // Validate first â€” any invalid inputs?
  const invalid = document.querySelectorAll('.mk-score-invalid').length;
  if(invalid){ toast(`${invalid} score${invalid===1?'':'s'} out of range`,'error'); return; }
  const btn = document.getElementById('mk-save-btn'); btn.disabled = true;
  const original = btn.innerHTML;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Savingâ€¦';

  // Collect entries for ALL components (so we don't lose other components when saving one)
  // BUT only send those that have a value OR were just cleared (need to support delete)
  // We'll send everything in window._mkEntries â€” backend treats empty string as null = delete.
  const entries = [];
  (window._mkRoster || []).forEach(l => {
    const perComp = window._mkEntries[l.id] || {};
    (window._mkComponents || []).forEach(c => {
      const raw = perComp[c.component_key];
      if(raw === undefined) return;
      const score = (raw === '' || raw == null) ? null : Number(raw);
      entries.push({ learner_id:l.id, component_key:c.component_key, score });
    });
  });

  const r = await api('POST','/api/teacher/marks', {
    class_id: ctx.class_id, subject_id: ctx.subject_id,
    assessment_type: ctx.assessment_type, term_id: window._mkTermId || undefined,
    entries
  });
  btn.disabled = false;
  btn.innerHTML = original;
  if(r.success){
    window._mkDirty = false;
    if(navigator.vibrate) navigator.vibrate([60,30,60]);
    toast(r.message || 'Marks saved','success');
  } else {
    toast(r.message || 'Save failed','error');
  }
}

function mk_switchAssessment(at){
  if(at === (window._mkCtx?.assessment_type)) return;
  const ctx = window._mkCtx; if(!ctx) return;
  goto('marks', {
    class_id:ctx.class_id, class_name:ctx.class_name,
    subject_id:ctx.subject_id, subject_name:ctx.subject_name, subject_code:ctx.subject_code,
    assessment_type:at
  });
}

      <div id="sk-area"><div class="empty"><i class="fas fa-spinner fa-spin"></i><p>Loading skillsâ€¦</p></div></div>
    </div>`;

  window._skCtx = { class_id, class_name, assessment_type:assessment };
  window._skDirty = false;
  window._skEntries = {}; // { learnerId: { categoryKey: { itemKey: rating } } }

  const [cfgResp, rosterResp, existingResp] = await Promise.all([
    api('GET', `/api/teacher/skills/config?class_id=${class_id}&assessment_type=${assessment}`),
    api('GET', `/api/teacher/classes/${class_id}/learners`),
    api('GET', `/api/teacher/skills?class_id=${class_id}&assessment_type=${assessment}`)
  ]);

  if(!cfgResp.success){
    document.getElementById('sk-area').innerHTML = `<div class="empty"><i class="fas fa-exclamation-triangle"></i><p>${esc(cfgResp.message||'Could not load skill config')}</p></div>`;
    return;
  }
  const config = cfgResp.data || {};
  const categories = config.categories || [];
  const ratings = config.ratings || [5,4,3,2,1];
  const ratingLabels = config.rating_labels || [];
  const roster = rosterResp.success ? (rosterResp.data?.learners || []) : [];
  const existing = existingResp.success ? (existingResp.data?.entries || {}) : {};
  window._skTermId = existingResp.success ? existingResp.data?.term?.id : null;
  window._skCategories = categories;
  window._skRatings = ratings;
  window._skRatingLabels = ratingLabels;
  window._skRoster = roster;
  if(!categories.length || !categories.some(c => c.items.length)){
    document.getElementById('sk-area').innerHTML = `<div class="empty"><i class="fas fa-sliders-h"></i><p>No skill categories configured.<br><span style="font-size:11px;">Ask admin to set them up in Template Editor â†’ Section 5.</span></p></div>`;
    return;
  }
  // Seed entries
  roster.forEach(l => {
    window._skEntries[l.id] = {};
    categories.forEach(cat => {
      window._skEntries[l.id][cat.key] = {};
      cat.items.forEach(it => {
        const r = existing[l.id]?.[cat.key]?.[it.key] ?? existing[String(l.id)]?.[cat.key]?.[it.key];
        if(r !== undefined && r !== null) window._skEntries[l.id][cat.key][it.key] = Number(r);
      });
    });
  });
  // Default to first category + first item
  window._skSelectedCategory = categories[0].key;
  window._skSelectedItem = categories[0].items[0]?.key || null;
  sk_renderCategoryNav();
}

function sk_renderCategoryNav(){
  const area = document.getElementById('sk-area');
  const categories = window._skCategories || [];
  area.innerHTML = `
    <div class="sk-cat-tabs">
      ${categories.map(cat => `<button class="sk-cat-tab ${cat.key===window._skSelectedCategory?'active':''}" onclick="sk_selectCategory('${esc(cat.key)}')">${esc(cat.label)}</button>`).join('')}
    </div>
    <div id="sk-item-area"></div>`;
  sk_renderItemNav();
}

function sk_renderItemNav(){
  const cat = (window._skCategories || []).find(c => c.key === window._skSelectedCategory);
  if(!cat){ document.getElementById('sk-item-area').innerHTML = ''; return; }
  // Ensure selected item exists in this category
  if(!cat.items.some(i => i.key === window._skSelectedItem)){
    window._skSelectedItem = cat.items[0]?.key || null;
  }
  document.getElementById('sk-item-area').innerHTML = `
    <div class="mk-comp-row">
      ${cat.items.map(it => `<button class="mk-comp-chip ${it.key===window._skSelectedItem?'active':''}" onclick="sk_selectItem('${esc(it.key)}')"><span class="mk-comp-name">${esc(it.label)}</span></button>`).join('')}
    </div>

}

function sk_selectCategory(key){
  if(window._skSelectedCategory === key) return;
  window._skSelectedCategory = key;
  sk_renderCategoryNav();
}
function sk_selectItem(key){
  if(window._skSelectedItem === key) return;
  window._skSelectedItem = key;
  sk_renderItemNav();
}
function sk_renderList(){
  const list = document.getElementById('sk-list');
  const roster = window._skRoster || [];
  const cat = window._skSelectedCategory;
  const item = window._skSelectedItem;
  const ratings = window._skRatings || [5,4,3,2,1];
  const labels  = window._skRatingLabels || [];
  if(!cat || !item || !roster.length){
    list.innerHTML = `<div class="empty"><i class="fas fa-users"></i><p>No learners or no items selected.</p></div>`;
    return;
  }
  // Stats: how many rated for this item
  let rated = 0;
  roster.forEach(l => { if(window._skEntries[l.id]?.[cat]?.[item] != null) rated++; });
  list.innerHTML = `
    <div class="mk-stats"><span class="mk-stat-pill">${rated} of ${roster.length} rated</span></div>
    <div class="sk-legend">${ratings.map((r,i) => `<span class="sk-legend-pill"><b>${esc(String(r))}</b> ${esc(labels[i]||'')}</span>`).join('')}</div>
    ${roster.map((l, i) => {
      const current = window._skEntries[l.id]?.[cat]?.[item];
      return `<div class="sk-row" data-learner-id="${l.id}">
        <div class="mk-info">
          <span class="mk-num">${i+1}</span>
          <div class="mk-name-block">
            <div class="mk-name">${esc(l.name||'')}</div>
            <div class="mk-adm">${esc(l.admission_no||'â€”')}</div>
          </div>
        </div>
        <div class="sk-rating-buttons">
          ${ratings.map(r => `<button class="sk-rb ${current===r?'active':''}" onclick="sk_setRating(${l.id},${r})">${esc(String(r))}</button>`).join('')}
          ${current!=null ? `<button class="sk-rb sk-rb-clear" title="Clear" onclick="sk_setRating(${l.id},null)">Ã—</button>` : ''}
        </div>
      </div>`;
    }).join('')}`;
}
function sk_setRating(learnerId, rating){
  const cat  = window._skSelectedCategory;
  const item = window._skSelectedItem;
  if(!cat || !item) return;
  if(!window._skEntries[learnerId]) window._skEntries[learnerId] = {};
  if(!window._skEntries[learnerId][cat]) window._skEntries[learnerId][cat] = {};
  if(rating == null){
    delete window._skEntries[learnerId][cat][item];
  } else {
    window._skEntries[learnerId][cat][item] = Number(rating);
  }
  window._skDirty = true;
  if(navigator.vibrate) navigator.vibrate(15);
  sk_renderList();
}
function sk_switchAssessment(at){
  if(at === (window._skCtx?.assessment_type)) return;
  const ctx = window._skCtx; if(!ctx) return;
  goto('skills', { class_id:ctx.class_id, class_name:ctx.class_name, assessment_type:at });
}
async function sk_save(){
  const ctx = window._skCtx; if(!ctx) return;
  const btn = document.getElementById('sk-save-btn'); btn.disabled = true;
  const original = btn.innerHTML;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Savingâ€¦';
  const entries = [];
  (window._skRoster || []).forEach(l => {
    const perL = window._skEntries[l.id] || {};
    (window._skCategories || []).forEach(cat => {
      const perCat = perL[cat.key] || {};
      cat.items.forEach(it => {
        // Always send so backend can delete cleared ones; backend skips unknown values
        const rating = perCat[it.key];
        entries.push({ learner_id:l.id, category_key:cat.key, item_key:it.key, rating: rating == null ? null : rating });
      });
    });
  });
  const r = await api('POST','/api/teacher/skills', {
    class_id: ctx.class_id, assessment_type: ctx.assessment_type,
    term_id: window._skTermId || undefined, entries
  });
  btn.disabled = false; btn.innerHTML = original;
  if(r.success){
    window._skDirty = false;
    if(navigator.vibrate) navigator.vibrate([60,30,60]);
    toast(r.message || 'Skills saved','success');
  } else {
    toast(r.message || 'Save failed','error');
  }
}

function cm_recountStats(){
  const total = (window._cmRoster || []).length;

  const box = document.getElementById('cm-stats');
  if(box) box.innerHTML = `<span class="mk-stat-pill">${filled} of ${total} commented</span>`;

function cm_filter(q){
  const term = String(q || '').trim().toLowerCase();
  document.querySelectorAll('.cm-row').forEach(row => {
    const hay = `${row.dataset.name || ''} ${row.dataset.adm || ''}`;
    row.classList.toggle('hidden', !!term && !hay.includes(term));
  });
}
function cm_pickSuggestion(learnerId){
  const bank = window._cmBank || [];
  if(!bank.length){ toast('No bank suggestions configured','error'); return; }
  const opts = bank.map((b,i) => `${i+1}. (${b.min_score}-${b.max_score}%) ${String(b.comment_text).slice(0,80)}${b.comment_text.length>80?'â€¦':''}`).join('\n');
  app.dialog.prompt(`Pick a comment (1-${bank.length}):\n\n${opts}`, 'Comment suggestion', pick => {
    const idx = Number(pick) - 1;
    if(!Number.isInteger(idx) || idx < 0 || idx >= bank.length) return;
    const text = bank[idx].comment_text;
    const ta = document.querySelector(`.cm-row[data-learner-id="${learnerId}"] textarea`);
    if(ta){
      ta.value = text;
      cm_setText(learnerId, text);
    }
  });
}

function learnerPhoto(profile){
  const src = profile?.portrait_path || profile?.photo_url || '';
  return `<div class="learner-avatar">${src ? `<img src="${esc(src)}" alt="">` : '<i class="fas fa-user-graduate"></i>'}</div>`;
}

function learnerAssessmentTabs(screen, active){
  const items = [
    ['midterm','Midterm'],
    ['endterm','Endterm']
  ];
  return `<div class="learner-filter-row">${items.map(([key,label]) =>
    `<button class="${active===key?'active':''}" onclick="goto('${screen}',{assessment_type:'${key}'})">${label}</button>`
  ).join('')}</div>`;
}

function learnerDateLabel(value){
  if(!value) return '-';
  const d = new Date(value + 'T00:00:00');
  if(Number.isNaN(d.getTime())) return value;
  return d.toLocaleDateString(undefined, { weekday:'short', day:'numeric', month:'short' });
}

function learnerStatusMeta(status){
  if(status === 'P') return { label:'Present', cls:'status-present', icon:'check-circle' };
  if(status === 'L') return { label:'Late', cls:'status-late', icon:'clock' };
  if(status === 'A') return { label:'Absent', cls:'status-absent', icon:'times-circle' };
  return { label:'Not marked', cls:'status-empty', icon:'minus-circle' };
}

async function renderLearnerMarks(params={}){
  const root = document.getElementById('dashboard-root');
  const requested = params.assessment_type || '';
  root.innerHTML = screenHeader('My Marks', requested ? capitalize(requested) : 'Current assessment')
    + `<div class="content"><div class="empty"><i class="fas fa-spinner fa-spin"></i><p>Loading marks...</p></div></div>`;
  const r = await api('GET', '/api/learner/marks' + (requested ? `?assessment_type=${encodeURIComponent(requested)}` : ''));
  if(!r.success){
    root.innerHTML = screenHeader('My Marks') + `<div class="content"><div class="empty"><i class="fas fa-exclamation-triangle"></i><p>${esc(r.message || 'Could not load marks')}</p></div></div>`;
    return;
  }
  const d = r.data || {};
  const active = d.assessment_type || requested || 'midterm';
  const subjects = d.subjects || [];
  const overall = d.overall_percent;
  root.innerHTML = screenHeader('My Marks', `${d.term?.name || 'Term'} - ${capitalize(active)}`)
    + `<div class="content">
      ${learnerAssessmentTabs('learnerMarks', active)}
      <div class="learner-score-card">
        <div class="learner-score-top">
          <div>
            <div class="learner-score-title">Overall performance</div>
            <div class="learner-score-sub">${subjects.filter(s => s.percent != null).length} subject${subjects.length===1?'':'s'} with scores</div>
          </div>
          <div class="learner-score-pct">${overall == null ? '-' : overall + '%'}</div>
        </div>
        <div class="bar-bg"><div class="bar-fill" style="width:${overall == null ? 0 : Math.max(0,Math.min(100,overall))}%"></div></div>
      </div>
      ${subjects.length ? subjects.map(s => `
        <div class="learner-score-card">
          <div class="learner-score-top">
            <div>
              <div class="learner-score-title">${esc(s.subject_name)}</div>
              <div class="learner-score-sub">${esc(s.subject_code || '')}</div>
            </div>
            <div class="learner-score-pct">${s.percent == null ? '-' : s.percent + '%'}</div>
          </div>
          <div class="component-list">
            ${(s.components || []).length ? s.components.map(c => `
              <div class="component-row">
                <span class="name">${esc(c.name || c.key)}</span>
                <span class="score">${c.score == null ? '-' : esc(c.score)} / ${esc(c.max || '-')}</span>
              </div>`).join('') : `<div class="component-row"><span class="name">No components configured</span><span class="score">-</span></div>`}
          </div>
        </div>`).join('') : `<div class="empty"><i class="fas fa-chart-line"></i><p>No marks have been released for this assessment yet.</p></div>`}
    </div>`;
}

function parentChildPhoto(child){
  return learnerPhoto({ portrait_path:child?.portrait_path });
}

async function renderParentDashboard(){
  const root = document.getElementById('dashboard-root');
  root.innerHTML = `<div class="content"><div class="empty"><i class="fas fa-spinner fa-spin"></i><p>Loading your children...</p></div></div>`;
  const [meResp, childrenResp] = await Promise.all([
    api('GET','/api/parent/me'),
    api('GET','/api/parent/children')
  ]);
  if(!childrenResp.success){
    root.innerHTML = `<div class="content"><div class="empty"><i class="fas fa-exclamation-triangle"></i><p>${esc(childrenResp.message || 'Could not load parent dashboard')}</p></div></div>`;
    return;
  }
  const parent = meResp.success ? (meResp.data || {}) : {};
  const children = childrenResp.data?.children || [];
  const avgAttendance = children.length ? Math.round(children.reduce((sum, c) => sum + Number(c.attendance_summary?.pct || 0), 0) / children.length) : 0;
  const scored = children.map(c => c.overall_percent).filter(v => v != null);
  const avgMarks = scored.length ? Math.round((scored.reduce((a,b)=>a+b,0) / scored.length) * 10) / 10 : null;

  root.innerHTML = `
    <div class="hero">
      <div class="hero-greeting">${greeting()},</div>
      <div class="hero-name">${esc(parent.name || me.name || 'Parent')}</div>
      <div class="learner-meta">
        <span class="chip"><i class="fas fa-child"></i> ${children.length} child${children.length===1?'':'ren'}</span>
        <span class="chip chip-gold"><i class="fas fa-phone"></i> ${esc(parent.phone || parent.email || parent.user_id || 'Parent account')}</span>
      </div>
    </div>

    <div class="stat-strip">
      <div class="stat"><div class="v">${children.length}</div><div class="l">Children</div></div>
      <div class="stat"><div class="v">${avgMarks == null ? '-' : avgMarks + '%'}</div><div class="l">Avg Marks</div></div>
      <div class="stat"><div class="v">${avgAttendance}%</div><div class="l">Attendance</div></div>
    </div>

    <div class="content">
      <div class="section">
        <div class="section-head">
          <div class="section-title"><i class="fas fa-users"></i> My Children</div>
          <a href="#" class="section-link" onclick="goto('parentProfile');return false;">Profile</a>
        </div>
        <div class="class-list">
          ${children.length ? children.map(child => `
            <button class="class-card-btn" onclick="goto('parentChild',{learner_id:${Number(child.id)}})">
              ${parentChildPhoto(child)}
              <div class="ck">
                <div class="cn">${esc(child.name)}</div>
                <div class="cm"><i class="fas fa-school"></i> ${esc(child.class_name || '-')} ${child.relationship ? `- ${esc(child.relationship)}` : ''}</div>
                <span class="learner-id-pill"><i class="fas fa-id-card"></i> ${esc(child.admission_no || child.user_id || '-')}</span>
              </div>
              <span class="att-status ${Number(child.attendance_summary?.pct || 0) >= 80 ? 'att-marked' : 'att-pending'}">${Number(child.attendance_summary?.pct || 0)}%</span>
              <i class="fas fa-chevron-right chev"></i>
            </button>`).join('') : `<div class="empty"><i class="fas fa-child"></i><p>No child is linked to this parent account yet.<br>Ask admin to link the learner in the parent records.</p></div>`}
        </div>
      </div>
    </div>`;
}

        <div class="learner-score-card">
          <div class="learner-score-top"><div><div class="learner-score-title">${esc(s.subject_name)}</div><div class="learner-score-sub">${esc(s.subject_code || '')}</div></div><div class="learner-score-pct">${s.percent == null ? '-' : s.percent + '%'}</div></div>

    </div>`;

async function markNotificationRead(id){
  const r = await api('POST', `/api/notifications/read/${id}`);
  const card = event?.currentTarget;
  if(card) card.classList.remove('unread');
  if(r.success) updateNotificationBadge(r.data?.unread_count ?? Math.max(0, unreadNotifications - 1));
}

window.registerDarajaDeviceToken = async function(token, platform='android'){
  if(!token) return { success:false, message:'No token supplied' };
  return api('POST','/api/notifications/device-token',{ token, platform });
};

async function registerNativePushDevice(){
  if(nativePushStarted || !me || me.role === 'admin') return;
  const push = window.Capacitor?.Plugins?.PushNotifications;
  if(!push) return;
  nativePushStarted = true;
  try{
    await push.addListener('registration', async token => {
      const value = token?.value || token;
      if(value) await window.registerDarajaDeviceToken(value, 'android');
    });
    await push.addListener('registrationError', err => {
      console.warn('Push registration failed', err);
    });
    await push.addListener('pushNotificationReceived', () => {
      refreshNotificationCount();
    });
    await push.addListener('pushNotificationActionPerformed', () => {
      refreshNotificationCount();
      currentScreen = 'notifications';
      screenParams = {};
      history.pushState({ screen:'notifications', params:{} }, '', '#notifications');
      renderCurrentScreen();
    });
    const perm = await push.requestPermissions();
    if(perm?.receive === 'granted') await push.register();
  }catch(err){
    console.warn('Push setup skipped', err);
  }
}

window.addEventListener('beforeinstallprompt', (event) => {
  event.preventDefault();
  installPromptEvent = event;

});

window.addEventListener('appinstalled', () => {
  installPromptEvent = null;
  setInstallButtonsVisible(false);
  toast('Daraja installed', 'success');
});

if('serviceWorker' in navigator && window.isSecureContext){
  window.addEventListener('load', () => navigator.serviceWorker.register('/app/sw.js').catch(()=>{}));
}

document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible') refreshNotificationCount();
});
window.addEventListener('focus', refreshNotificationCount);
