name: Deploy Portal

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Update Google Cloud VM
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT || 22 }}
          script: |
            set -e
            cd ~/portal
            git fetch origin main
            git reset --hard origin/main
            python3 -m pip install -r requirements.txt
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/check_python.py
            pm2 delete joyland-portal || true
            SESSION_SECRET="${{ secrets.SESSION_SECRET }}" RESOURCE_ADMIN_PASSWORD="${{ secrets.RESOURCE_ADMIN_PASSWORD }}" APP_ENV=production pm2 start py_backend.py --name joyland-portal --interpreter python3
            pm2 save
